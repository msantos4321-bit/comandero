<style>
:root{--brand:#F6A933;--brand-ink:#1D1B19;--brand-soft:#FFF1DA;--bg:#FAF7F2;--card:#FFFFFF;--ink:#1F1C19;--muted:#7A726A;--line:#ECE6DE;--chip:#F2EDE6;--ok:#1E8A55;--ok-soft:#E2F4EA;--warn:#B86E00;--warn-soft:#FDF0D9;--bad:#C2392B;--bad-soft:#FCE8E5;--info:#2E6BD0;--info-soft:#E7EFFC;--r:18px;--sab:env(safe-area-inset-bottom);--sat:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Nunito,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}

.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}.app>div{min-width:0}
.side{display:none}
.top{position:sticky;top:0;z-index:5;background:rgba(250,247,242,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:calc(var(--sat) + 10px) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}

main{padding:14px 16px calc(100px + var(--sab));max-width:1100px;width:100%;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(6,1fr);background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 2px calc(6px + var(--sab))}
.tabs button,.side button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0;cursor:pointer;position:relative}
.tabs svg,.side svg{width:24px;height:24px}
.tabs .on,.side .on{color:var(--ink)}
.tabs .on svg,.side .on svg{color:#D98A0F}
.dot{position:absolute;top:0;right:22%;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
@media(min-width:900px){
 .app{grid-template-columns:230px minmax(0,1fr)}
 .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:18px 12px;background:#fff;border-right:1px solid var(--line)}

 .side button.on{background:var(--brand-soft)}
 .side .dot{position:static;margin-left:auto}

 .tabs{display:none}
 .top{display:none}

 main{padding:20px 28px 40px}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:13px;padding:11px 15px;font-weight:800;font-size:15px;cursor:pointer;background:var(--chip);color:var(--ink);text-decoration:none;white-space:normal;text-align:center;line-height:1.25}

label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:12px 2px 5px}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:flex;background:#EFEAE3;border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button{border:0;background:none;border-radius:9px;padding:8px 13px;font-weight:800;font-size:14.5px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(30,20,10,.34);display:flex;align-items:flex-end;justify-content:center;animation:f .18s}

.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + var(--sab));animation:u .22s cubic-bezier(.2,.8,.2,1)}

.grab{width:38px;height:5px;border-radius:9px;background:#D6CEC4;margin:2px auto 10px}
.sheet h2{font-size:23px;font-weight:900;margin-bottom:2px}

.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-size:14.5px;font-weight:700;z-index:40;max-width:92vw;text-align:center}
.alerta{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl td,.tbl th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}

.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.r{text-align:right}
.hist{border-left:3px solid var(--brand);padding:4px 0 4px 12px;margin:0 0 14px}
.hist b{display:block}
.hist p{margin:3px 0;font-size:14.5px}
.rx{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.rx b{font-weight:900}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}

.chk.on i{background:var(--ok);border-color:var(--ok)}
.chk.on span{color:var(--muted);text-decoration:line-through}#fac-chk.on span{color:inherit;text-decoration:none}
canvas.firma{width:100%;height:160px;background:#fff;border:1px dashed #CFC6BB;border-radius:12px;touch-action:none}
.empty{color:var(--muted);text-align:center;padding:24px}
.demo{background:var(--brand-soft);border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:14px;color:#6B4A0A}
.bar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
svg.spark{width:100%;height:70px}
.chev{color:var(--muted);font-size:22px;line-height:1;margin-left:6px}
.lnk{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}.lnk:last-child{border-bottom:0}
.adm{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}.adm:last-child{border-bottom:0}.adm .e{font-size:22px;width:30px;text-align:center}.adm b{display:block;font-weight:800;line-height:1.25}.adm small{color:var(--muted);font-size:13.5px}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block!important;font:11.5pt/1.45 Nunito,Arial,sans-serif;color:#000}#print .pc{display:flex;gap:14px;align-items:center;border-bottom:3px solid var(--brand);padding-bottom:10px;margin-bottom:16px}#print .pc img{width:66px;height:66px;border-radius:50%}#print h2{margin:4px 0 0;font-size:18pt}#print h3{margin:16px 0 6px}#print .en{color:#555;margin-bottom:12px}#print table{width:100%;border-collapse:collapse}#print th,#print td{border:1px solid #aaa;padding:6px 9px;text-align:left;vertical-align:top}#print th{width:40%;background:#f5f1ea}#print .pf{margin-top:60px;display:flex;justify-content:space-between;align-items:flex-end}#print .pl{text-align:center;min-width:270px;border-top:1px solid #000;padding-top:6px}@page{margin:14mm}}.av svg{width:24px;height:24px}@media(max-width:560px){.hm{display:none}}
</style>

<body>
<div class="app"><nav class="side" id="side"></nav><div><header class="top" id="top"></header><main id="main"></main></div></div>

<script>
/* ===== Consultorio veterinario · demostración ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'$'+Math.round(v||0).toLocaleString('es-MX');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const D=864e5,ahora=()=>Date.now();
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const hoy0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const hora=t=>new Date(t).toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'});
const fecha=(t,o)=>new Date(t).toLocaleDateString('es-MX',o||{day:'numeric',month:'short'});
const edad=t=>{const m=Math.floor((ahora()-t)/(30.44*D));return m<12?m+(m===1?' mes':' meses'):Math.floor(m/12)+(Math.floor(m/12)===1?' año':' años')};
const telWa=t=>{t=String(t||'').replace(/\D/g,'');return t.length===10?'52'+t:t};
function toast(t,ms){document.querySelectorAll('.toast').forEach(e=>e.remove());const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),ms||2600)}
function wa(tel,txt){window.open('https://wa.me/'+telWa(tel)+'?text='+encodeURIComponent(txt),'_blank')}
const CID=(new URLSearchParams(location.search).get('c')||'estacion-veterinaria').replace(/[^a-z0-9-]/g,'');
let C=null,S=null,ui={tab:'hoy',q:'',dia:0};
const KEY='vet-demo-'+CID;
/* ---------- Datos de ejemplo ---------- */
function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function seed(){const r=rnd(7),pick=a=>a[Math.floor(r()*a.length)],now=ahora(),h0=hoy0();
 const nombres=['Mariana López','Jorge Ramírez','Lucía Hernández','Carlos Medina','Ana Sofía Ruiz','Roberto Castillo','Gabriela Torres','Miguel Ángel Soto','Daniela Flores','Fernando Aguilar','Patricia Gómez','Luis Navarro','Valeria Cruz','Ricardo Morales','Andrea Vega','Héctor Ortiz','Karen Díaz','Sergio Peña','Claudia Rivas','Alejandro Mejía','Paola Sánchez','Eduardo Lara','Mónica Salas','Iván Contreras'];
 const perros=[['Max','Labrador'],['Luna','Schnauzer'],['Rocky','Pitbull'],['Canela','Chihuahua'],['Toby','Poodle'],['Kira','Pastor alemán'],['Jack','Mestizo'],['Nala','Golden retriever'],['Bruno','Bulldog francés'],['Lola','Yorkshire'],['Coco','Shih tzu'],['Zeus','Husky'],['Mía','Beagle'],['Thor','Rottweiler'],['Princesa','Maltés'],['Simba','Mestizo'],['Chispa','Dachshund'],['Bobby','Border collie']];
 const gatos=[['Michi','Doméstico'],['Pelusa','Persa'],['Garfield','Doméstico naranja'],['Salem','Doméstico negro'],['Kiara','Siamés'],['Oliver','Doméstico'],['Mimi','Angora']];
 const duenos=nombres.map((n,i)=>({id:'d'+i,nombre:n,tel:'664'+String(1000000+Math.floor(r()*8999999)),desde:now-Math.floor(r()*700+30)*D}));
 const masc=[];let k=0;
 [...perros.map(x=>['Perro',...x]),...gatos.map(x=>['Gato',...x])].forEach(([esp,n,raza],i)=>{const d=duenos[i%duenos.length];const peso=esp==='Gato'?3+r()*3:({Chihuahua:2.5,Yorkshire:3,Maltés:3.5,Poodle:6,'Shih tzu':6,Schnauzer:8,Dachshund:7,'Bulldog francés':11,Beagle:12,Mestizo:14,'Border collie':17,Husky:22,Pitbull:25,Labrador:30,'Golden retriever':29,'Pastor alemán':33,Rottweiler:42}[raza]||12)*(0.9+r()*0.2);
  const nac=now-Math.floor(r()*(i%6===0?0.8:10)*365*D)-60*D;const pesos=[];for(let j=5;j>=0;j--)pesos.push([now-j*60*D-Math.floor(r()*20)*D,Math.round(peso*(1-j*0.012+r()*0.03)*10)/10]);
  masc.push({id:'m'+(k++),dueno:d.id,nombre:n,especie:esp,raza,sexo:r()<.5?'Macho':'Hembra',nac,esteril:r()<.6,alergias:i===3?'Penicilina':i===12?'Pollo (alimento)':'',pesos:pesos.filter(p=>p[0]>nac),color:pick(['café','negro','blanco','gris','dorado','atigrado','manchado'])})});
 const cons=[],vac=[],ventas=[];const motivos=[['Vómito y diarrea','Gastroenteritis','Dieta blanda 3 días, hidratación','Metronidazol'],['Cojea de la pata trasera','Esguince leve','Reposo 7 días','Meloxicam'],['Comezón y se rasca mucho','Dermatitis alérgica','Shampoo medicado, cambio de alimento','Prednisolona'],['Revisión general','Paciente sano','Vacunas al día','' ],['Tos','Traqueobronquitis','Evitar collar, reposo','Amoxicilina con clavulánico'],['No quiere comer','Gastritis','Omeprazol y dieta','Omeprazol'],['Herida en la oreja','Otitis externa','Limpieza de oídos','Enrofloxacino'],['Dolor al caminar (adulto mayor)','Artrosis','Control de peso, suplemento articular','Meloxicam']];
 for(let d=60;d>=1;d--){const t0=h0-d*D;const dow=new Date(t0).getDay();if(dow===0)continue;const n=3+Math.floor(r()*4);for(let j=0;j<n;j++){const m=pick(masc),mo=pick(motivos),t=t0+(9.5+r()*8.5)*36e5;const med=C.medicamentos.find(x=>x.n===mo[3]);const peso=m.pesos[m.pesos.length-1][1];
   const rx=med?[{med:med.n,mg:Math.round(peso*med[m.especie==='Gato'?'gato':'perro']*10)/10,ml:Math.round(peso*med[m.especie==='Gato'?'gato':'perro']/med.mgml*100)/100,frec:med.frec,dias:med.dias,via:med.via}]:[];
   const cobro=[['Consulta general',350]];if(r()<.25)cobro.push(['Ultrasonido',750]);if(med&&r()<.6){const p=C.productos.find(x=>x[0].startsWith(med.n.split(' ')[0])&&x[5]>0);if(p)cobro.push([p[0],p[5]])}
   const c={id:uid(),mid:m.id,t,motivo:mo[0],peso,temp:(38+r()*1.2).toFixed(1),fc:Math.floor(80+r()*60),fr:Math.floor(18+r()*16),expl:'Mucosas rosadas, hidratación adecuada.',dx:mo[1],plan:mo[2],rx,doc:r()<.7?C.doctor:'Dra. Ana López',cobro};cons.push(c);
   ventas.push({id:uid(),t:t+20*60000,mid:m.id,items:cobro.map(x=>[x[0],1,x[1]]),total:cobro.reduce((a,x)=>a+x[1],0),met:pick(['Efectivo','Efectivo','Tarjeta','Transferencia']),ref:c.id});}
   if(r()<.4){const m=pick(masc);const tipo=pick(C.vacunas[m.especie]);const pr=C.servicios.find(s=>s[0].toLowerCase().includes(tipo[0].split(' ')[0].toLowerCase().slice(0,6)))||['Vacuna',400];ventas.push({id:uid(),t:t0+12*36e5,mid:m.id,items:[[pr[0],1,pr[1]]],total:pr[1],met:'Efectivo'})}
   if(r()<.5){const p=pick(C.productos.filter(x=>x[5]>0&&x[1]==='Tienda'));ventas.push({id:uid(),t:t0+(10+r()*8)*36e5,items:[[p[0],1,p[5]]],total:p[5],met:pick(['Efectivo','Tarjeta'])})}}
 const extra=[['Pirata','Perro','Mestizo'],['Duquesa','Perro','Poodle'],['Rex','Perro','Pastor alemán'],['Bombón','Perro','Pomerania'],['Tom','Gato','Doméstico'],['Frida','Perro','Schnauzer'],['Capitán','Perro','Labrador']],exD=['Rosa Elena Pérez','Javier Ibarra','Silvia Montes','Óscar Villalobos','Laura Quintero','Armando Félix','Teresa Galindo'];

    parts.push(h,name,data);cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);off+=h.length+name.length+data.length});
  const cl=cen.reduce((a,x)=>a+x.length,0);return new Blob([...parts,...cen,new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cl),...u32(off),0,0])],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}

    ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${x(s.name.slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],

function firmaInit(){const c=$('#firma');if(!c)return;const r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;const x=c.getContext('2d');x.scale(2,2);x.lineWidth=2.4;x.lineCap='round';x.strokeStyle='#1F1C19';let on=false;ui.firmo=false;
 const p=e=>{const b=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return [t.clientX-b.left,t.clientY-b.top]};
 const dn=e=>{on=true;ui.firmo=true;const [a,b]=p(e);x.beginPath();x.moveTo(a,b);e.preventDefault()},mv=e=>{if(!on)return;const [a,b]=p(e);x.lineTo(a,b);x.stroke();e.preventDefault()},up=()=>on=false;
 c.addEventListener('pointerdown',dn);c.addEventListener('pointermove',mv);addEventListener('pointerup',up)}

 abonoOk:d=>{const a=S.adeudos.find(x=>x.id===d.i),mo=Math.min(saldo(a),+v('ab-m')||0);if(!mo){toast('Escribe cuánto abonó');return}a.abonos.push([ahora(),mo,d.m]);if(v('ab-p'))a.prom=new Date(v('ab-p')+'T12:00').getTime();S.ventas.push({id:uid(),t:ahora(),mid:a.mid,items:[['Abono: '+a.concepto,1,mo]],total:mo,met:d.m});guardar();cerrar();render();toast(saldo(a)<1?'¡Quedó liquidado!':'Abono registrado. Resta '+money(saldo(a)))},

 presWa:d=>{const p=S.presup.find(x=>x.id===d.p),m=mDe(p.mid),du=dDe(m.dueno),seg=ahora()-p.t>2*D;wa(du.tel,seg?`Hola ${nom1(du)}, ¿pudo revisar el presupuesto de ${m.nombre} (${p.titulo}) por ${money(totP(p))}? Si tiene dudas, con gusto se las resolvemos. — ${C.nombre}`:`Hola ${nom1(du)}, le compartimos el presupuesto para ${m.nombre}: ${p.titulo}\n\n${p.items.map(x=>`• ${x[0]}${x[1]>1?' ×'+x[1]:''}: ${money(x[1]*x[2])}`).join('\n')}\n\nTotal: ${money(totP(p))}\nSe aparta con el 50% de anticipo. Vigencia: 15 días.\n\n— ${C.doctor}, ${C.nombre}`);if(seg){p.t=ahora()-1*D}guardar();setTimeout(render,300)},
 presSi:d=>{const p=S.presup.find(x=>x.id===d.p);modal(`<h2>¡Aceptó!</h2><p class="sub">${esc(p.titulo)} · ${money(totP(p))}</p><label for="an-m">¿Cuánto deja de anticipo?</label><input id="an-m" type="number" inputmode="decimal" value="${Math.round(totP(p)/2)}"><label for="an-f">¿Para cuándo?</label><input id="an-f" type="date" value="${dk(ahora()+3*D)}"><div class="acts" style="margin-top:16px">${['Efectivo','Tarjeta','Transferencia'].map(mt=>`<button class="btn ${mt==='Efectivo'?'ok':''}" data-a="presSiOk" data-p="${p.id}" data-m="${mt}">${mt}</button>`).join('')}</div><p class="sub" style="margin-top:10px">Se agenda la cita y lo que falta queda en Dinero › Me deben.</p>`)},
 presSiOk:d=>{const p=S.presup.find(x=>x.id===d.p),an=+v('an-m')||0,f=v('an-f'),t=f?new Date(f+'T10:00').getTime():ahora()+3*D;p.estado='aceptado';p.anticipo=an;S.adeudos.push({id:uid(),mid:p.mid,t:ahora(),concepto:p.titulo,total:totP(p),abonos:an?[[ahora(),an,d.m]]:[],prom:t});if(an)S.ventas.push({id:uid(),t:ahora(),mid:p.mid,items:[['Abono: anticipo '+p.titulo,1,an]],total:an,met:d.m});S.citas.push({id:uid(),mid:p.mid,t,dur:120,motivo:p.titulo,estado:'agendada'});guardar();cerrar();render();toast('Anticipo registrado y cita agendada')},
 presNo:d=>{S.presup.find(x=>x.id===d.p).estado='rechazado';guardar();render()},
 planNuevo:d=>{ui.pp='adulto';modal(`<h2>Inscribir a un plan</h2><label>Paciente</label>${selMascota(d&&d.m)}<label>Plan</label><div class="chips">${C.planes.map(p=>`<button class="chip ${p.id==='adulto'?'on':''}" data-a="ppSel" data-p="${p.id}">${esc(p.n)} · ${money(p.precio)}</button>`).join('')}</div><p class="sub" style="margin-top:10px">Se cobra hoy la primera mensualidad. Cada mes te aparece en «Hoy» a quién le toca pagar.</p><div class="acts" style="margin-top:12px"><button class="btn" data-a="cerrar">Cancelar</button><span class="sp"></span><button class="btn pri" data-a="planOk">Inscribir y cobrar</button></div>`)},
 ppSel:(d,e)=>{ui.pp=d.p;document.querySelectorAll('[data-a="ppSel"]').forEach(b=>b.classList.toggle('on',b.dataset.p===d.p))},

 planPago:d=>{const x=S.miembros.find(y=>y.id===d.x),p=planDe(x.plan);x.pagos.push(ahora());S.ventas.push({id:uid(),t:ahora(),mid:x.mid,items:[[p.n+' (mensualidad)',1,p.precio]],total:p.precio,met:'Efectivo'});guardar();render();toast('Mensualidad cobrada: '+money(p.precio))},
 planRec:d=>{const x=S.miembros.find(y=>y.id===d.x),p=planDe(x.plan),m=mDe(x.mid),du=dDe(m.dueno),e=pagoPlan(x);wa(du.tel,`Hola ${nom1(du)}, le recordamos la mensualidad del ${p.n} de ${m.nombre} (${money(p.precio)}), ${e.d<0?'que venció el '+fecha(e.sig,{day:'numeric',month:'long'}):'que vence el '+fecha(e.sig,{day:'numeric',month:'long'})}. Puede pagar en la clínica o por transferencia. ¡Gracias por confiar en nosotros! 🐾`)},
 cumpleWa:d=>{const m=mDe(d.m),du=dDe(m.dueno);wa(du.tel,`¡Hola ${nom1(du)}! 🎂 En ${C.nombre} sabemos que ${m.nombre} está de cumpleaños. Para festejarlo, este mes tiene 10% de descuento en su consulta, baño o alimento. ¡Felicidades! 🐾`);S.avisos['b'+m.id+new Date().getFullYear()]=ahora();guardar();setTimeout(render,300)},
 reactWa:d=>{const m=mDe(d.m),du=dDe(m.dueno);wa(du.tel,`Hola ${nom1(du)}, le saludamos de ${C.nombre} 🐾. Hace tiempo que no vemos a ${m.nombre} y ya le toca su revisión y sus vacunas. Esta semana le regalamos la desparasitación si viene a su chequeo. ¿Le agendamos?`);S.avisos['i'+m.id]=ahora();guardar();setTimeout(render,300)},
 pedidoWa:()=>{const L=S.prods.filter(p=>p.stock<p.min);wa(C.proveedor.tel,`Hola, buen día. Le escribimos de ${C.nombre} para hacer un pedido:\n\n${L.map(p=>`• ${sug(p)} × ${p.nombre}`).join('\n')}\n\n¿Nos confirma disponibilidad y fecha de entrega? Gracias.`)},
 pedidoLlego:()=>{const L=S.prods.filter(p=>p.stock<p.min);const tot=L.reduce((s,p)=>s+sug(p)*p.costo,0);L.forEach(p=>{if(C.controlados.includes(p.nombre))S.contr.push({id:uid(),t:ahora(),prod:p.nombre,cant:sug(p),u:'pzas',tipo:'entrada',motivo:'Compra a '+C.proveedor.n});p.stock+=sug(p);p.cad=Math.max(p.cad,ahora()+365*D)});S.gastos.push({id:uid(),t:ahora(),cat:'Medicamentos y vacunas',concepto:'Pedido a '+C.proveedor.n,monto:Math.round(tot),factura:true,pagado:false,vence:ahora()+15*D});guardar();render();toast('Inventario actualizado. El pago quedó en Dinero › Por pagar.',4000)},
 contrNuevo:()=>modal(`<h2>Registrar uso de controlado</h2><label for="co-p">Medicamento</label><select id="co-p">${C.controlados.map(n=>`<option>${esc(n)}</option>`).join('')}</select><div class="f2"><div><label for="co-c">Cantidad</label><input id="co-c" type="number" step="0.1" inputmode="decimal"></div><div><label for="co-u">Unidad</label><select id="co-u"><option>ml</option><option>ampolleta</option><option>frasco</option></select></div></div><label>Paciente</label>${selMascota()}<label for="co-m">Motivo</label><input id="co-m" type="text" placeholder="Ej. Anestesia: esterilización"><label for="co-d">Quién lo aplicó</label><select id="co-d">${C.equipo.filter(e=>/Dr|Dra/.test(e.n)).map(e=>`<option>${esc(e.n)}</option>`).join('')}</select><div class="acts" style="margin-top:16px"><button class="btn" data-a="cerrar">Cancelar</button><span class="sp"></span><button class="btn pri" data-a="contrOk">Guardar</button></div>`),
 contrOk:()=>{if(!+v('co-c')){toast('Escribe la cantidad');return}S.contr.push({id:uid(),t:ahora(),prod:v('co-p'),cant:+v('co-c'),u:v('co-u'),mid:v('sel-m'),motivo:v('co-m')||'Uso clínico',doc:v('co-d'),tipo:'salida'});guardar();cerrar();render();toast('Registrado en la bitácora')},
 contrExcel:()=>{const f=t=>new Date(t).toLocaleString('es-MX');compartir(xlsx([{name:'Bitácora',rows:[['Fecha','Medicamento','Movimiento','Cantidad','Unidad','Paciente','Dueño','Motivo','Responsable'],...S.contr.slice().sort((a,b)=>a.t-b.t).map(x=>{const m=x.mid&&mDe(x.mid);return [f(x.t),x.prod,x.tipo==='entrada'?'Entrada':'Salida',x.cant,x.u,m?m.nombre:'',m?dDe(m.dueno).nombre:'',x.motivo,x.doc||'']})]}]),`Bitacora controlados - ${C.nombre}.xlsx`)},
 facTog:()=>{ui.fac=!ui.fac;$('#fac-chk').classList.toggle('on',ui.fac);$('#fac-chk i').textContent=ui.fac?'✓':'';$('#fac-box').style.display=ui.fac?'block':'none'},
 recibo:d=>{const x=S.ventas.find(y=>y.id===d.v)||ui.lastVt,m=mDe(x.mid),du=dDe(m.dueno),a=x.adeudo&&S.adeudos.find(y=>y.id===x.adeudo);wa(du.tel,`Recibo — ${C.nombre}\n${fecha(x.t,{day:'numeric',month:'long',year:'numeric'})} · ${m.nombre}\n\n${(x.det||x.items).map(y=>`• ${y[0]}${y[1]>1?' ×'+y[1]:''}: ${money(y[1]*y[2])}`).join('\n')}\n\nPagó: ${money(x.total)} (${x.met})${a?'\nSaldo pendiente: '+money(saldo(a)):''}\n\n¡Gracias por su confianza! 🐾`)}
});

function nav(){const it=TABS.map(([k,l])=>{const b=badge(k);return `<button class="${ui.tab===k?'on':''}" data-a="tab" data-t="${k}">${ICON[k]}<span>${l}</span>${b?`<i class="dot">${b}</i>`:''}</button>`});
 $('#side').innerHTML=`<div class="brand"><img src="${esc(C.logo)}" alt=""><div><b>${esc(C.nombre)}</b><small>${esc(C.doctor)}</small></div></div>`+it.join('');
 const mob=['hoy','agenda','pacientes','hospital','caja'];$('#tabs').innerHTML=TABS.filter(([k])=>mob.includes(k)).map(([k,l])=>{const b=badge(k);return `<button class="${ui.tab===k?'on':''}" data-a="tab" data-t="${k}">${ICON[k]}<span>${l}</span>${b?`<i class="dot">${b}</i>`:''}</button>`}).join('')+`<button class="${!mob.includes(ui.tab)?'on':''}" data-a="mas">${ICON.mas}<span>Más</span>${TABS.filter(([k])=>!mob.includes(k)).some(([k])=>badge(k))?'<i class="dot" style="min-width:10px;height:10px;padding:0"></i>':''}</button>`;
 $('#top').innerHTML=`<img src="${esc(C.logo)}" alt=""><div><b>${esc(C.nombre)}</b><small>${esc(C.lema)}</small></div><span class="sp"></span>`}
A.mas=()=>{const mob=['hoy','agenda','pacientes','hospital','caja'];modal(`<h2>Más</h2><div class="list" style="margin-top:10px">${TABS.filter(([k])=>!mob.includes(k)).map(([k,t])=>{const b=badge(k);return `<button class="item" data-a="tab" data-t="${k}"><div class="av">${ICON[k]}</div><div class="t"><b>${t}</b><span>${MASD[k]}</span></div>${b?`<i class="dot" style="position:static">${b}</i>`:''}</button>`}).join('')}</div>`)};
function render(){nav();$('#main').innerHTML={hoy:vHoy,agenda:vAgenda,pacientes:vPacientes,hospital:vHospital,caja:vCaja,farmacia:vFarmacia,dinero:vDinero,planes:vPlanes,presup:vPresup,clientes:vClientes,resumen:vDinero}[ui.tab]();document.title=C.nombre}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=A[b.dataset.a];if(!f)return;if(b.dataset.a==='consulta'||b.dataset.a==='cita_consultar')ui.cm=b.dataset.m||ui.cm;f(b.dataset,e)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){ui.q=t.value;const p=t.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}if(t.id==='c-peso'&&ui.cm)pintarRx(mDe(ui.cm))});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='g-foto'&&t.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,900/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ui.gf=c.toDataURL('image/jpeg',.7);$('#g-fok').textContent='✓ Foto lista'};im.src=r.result};r.readAsDataURL(t.files[0]);return}if(t.id==='arch-in'){const m=mDe(t.dataset.m);m.archivos=m.archivos||[];[...t.files].slice(0,4).forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,640/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);m.archivos.push({n:f.name.replace(/\.[^.]+$/,''),t:ahora(),src:c.toDataURL('image/jpeg',.75)});guardar();ui.ft='arch';modal(fichaHtml(m))};im.src=r.result};r.readAsDataURL(f)})}});
fetch('c/'+CID+'.json',{cache:'no-cache'}).then(r=>r.json()).then(c=>{C=c;document.documentElement.style.setProperty('--brand',C.color);C.logo=C.logo||'../icono-192.png';S=cargar();guardar();render()}).catch(()=>{$('#main').innerHTML='<div class="empty">No se pudo abrir esta demostración.</div>'});
