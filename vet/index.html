<!doctype html>
<html lang="es">
<head>

<style>
:root{--brand:#F6A933;--brand-ink:#1D1B19;--brand-soft:#FFF1DA;--bg:#FAF7F2;--card:#FFFFFF;--ink:#1F1C19;--muted:#7A726A;--line:#ECE6DE;--chip:#F2EDE6;--ok:#1E8A55;--ok-soft:#E2F4EA;--warn:#B86E00;--warn-soft:#FDF0D9;--bad:#C2392B;--bad-soft:#FCE8E5;--info:#2E6BD0;--info-soft:#E7EFFC;--r:18px;--sab:env(safe-area-inset-bottom);--sat:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Nunito,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}.app>div{min-width:0}
.side{display:none}
.top{position:sticky;top:0;z-index:5;background:rgba(250,247,242,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:calc(var(--sat) + 10px) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.top img{width:42px;height:42px;border-radius:50%}
.top b{display:block;font-size:17px;font-weight:900;line-height:1.1}
.top small{color:var(--muted);font-size:13px;font-weight:700}
.top .sp{flex:1}
main{padding:14px 16px calc(100px + var(--sab));max-width:1100px;width:100%;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(6,1fr);background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 2px calc(6px + var(--sab))}
.tabs button,.side button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0;cursor:pointer;position:relative}
.tabs svg,.side svg{width:24px;height:24px}
.tabs .on,.side .on{color:var(--ink)}
.tabs .on svg,.side .on svg{color:#D98A0F}
.dot{position:absolute;top:0;right:22%;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
@media(min-width:900px){
 .app{grid-template-columns:230px minmax(0,1fr)}
 .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:18px 12px;background:#fff;border-right:1px solid var(--line)}
 .side .brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
 .side .brand img{width:46px;height:46px;border-radius:50%}
 .side .brand b{font-weight:900;line-height:1.1}
 .side .brand small{display:block;color:var(--muted);font-size:12.5px}
 .side button{flex-direction:row;gap:12px;font-size:15.5px;padding:11px 12px;border-radius:12px;justify-content:flex-start}
 .side button.on{background:var(--brand-soft)}
 .side .dot{position:static;margin-left:auto}
 .tabs{display:none}
 .top{display:none}
 .top .tb{display:none}
 main{padding:20px 28px 40px}
}
.h1{font-size:28px;font-weight:900;margin:2px 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(60,40,10,.05)}
.sec{margin:22px 2px 10px;font-size:13px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:8px}
.sec .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:800}
.kpi b{display:block;font-size:26px;font-weight:900;margin-top:2px}
.kpi small{color:var(--muted);font-size:12.5px}
.grid2{display:grid;gap:14px}
@media(min-width:900px){.grid2{grid-template-columns:1.25fr 1fr}}
.list{display:grid;gap:8px}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px;border:0;width:100%;text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.item .t{min-width:0;flex:1}
.item b{display:block;font-weight:800;line-height:1.25}
.item span{display:block;color:var(--muted);font-size:13.5px;line-height:1.3}.item span.tag,.item b .tag{display:inline-block;color:inherit}.item .tag.t-ok{color:var(--ok)}.item .tag.t-warn{color:var(--warn)}.item .tag.t-bad{color:var(--bad)}.item .tag.t-info{color:var(--info)}.item .tag.t-br{color:#8A5600}
.hora{flex:none;width:58px;text-align:center;font-weight:900;font-size:15px}
.hora small{display:block;color:var(--muted);font-weight:700;font-size:11.5px}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--brand-soft)}
.av.g{background:#E8F0FE}
.av.lg{width:72px;height:72px;font-size:38px}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-warn{background:var(--warn-soft);color:var(--warn)}.t-bad{background:var(--bad-soft);color:var(--bad)}.t-info{background:var(--info-soft);color:var(--info)}.t-br{background:var(--brand-soft);color:#8A5600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:13px;padding:11px 15px;font-weight:800;font-size:15px;cursor:pointer;background:var(--chip);color:var(--ink);text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.dk{background:var(--ink);color:#fff}
.btn.wa{background:#25D366;color:#06210f}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:10px}
.btn.full{width:100%}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:#EFEAE3;border-radius:13px;padding:10px 12px;margin-bottom:12px}
.search input{border:0;background:none;outline:none;width:100%;font-size:16px}
label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:12px 2px 5px}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:76px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-size:14px;font-weight:700;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:flex;background:#EFEAE3;border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button{border:0;background:none;border-radius:9px;padding:8px 13px;font-weight:800;font-size:14.5px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(30,20,10,.34);display:flex;align-items:flex-end;justify-content:center;animation:f .18s}
@media(min-width:900px){.ov{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + var(--sab));animation:u .22s cubic-bezier(.2,.8,.2,1)}
@media(min-width:900px){.sheet{border-radius:22px}}
.grab{width:38px;height:5px;border-radius:9px;background:#D6CEC4;margin:2px auto 10px}
.sheet h2{font-size:23px;font-weight:900;margin-bottom:2px}
@keyframes u{from{transform:translateY(40px);opacity:.4}}@keyframes f{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-size:14.5px;font-weight:700;z-index:40;max-width:92vw;text-align:center}
.alerta{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl td,.tbl th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.r{text-align:right}
.hist{border-left:3px solid var(--brand);padding:4px 0 4px 12px;margin:0 0 14px}
.hist b{display:block}
.hist p{margin:3px 0;font-size:14.5px}
.rx{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.rx b{font-weight:900}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk i{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid #CFC6BB;display:grid;place-items:center;font-style:normal;font-weight:900;color:#fff}
.chk.on i{background:var(--ok);border-color:var(--ok)}
.chk.on span{color:var(--muted);text-decoration:line-through}
canvas.firma{width:100%;height:160px;background:#fff;border:1px dashed #CFC6BB;border-radius:12px;touch-action:none}
.empty{color:var(--muted);text-align:center;padding:24px}
.demo{background:var(--brand-soft);border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:14px;color:#6B4A0A}
.bar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
svg.spark{width:100%;height:70px}.av svg{width:24px;height:24px}@media(max-width:560px){.hm{display:none}}
</style>
</head>
<body>
<div class="app"><nav class="side" id="side"></nav><div><header class="top" id="top"></header><main id="main"></main></div></div>
<nav class="tabs" id="tabs"></nav>
<div id="modal"></div>
<script>
/* ===== Consultorio veterinario · demostración ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'$'+Math.round(v||0).toLocaleString('es-MX');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const D=864e5,ahora=()=>Date.now();
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const hoy0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const hora=t=>new Date(t).toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'});
const fecha=(t,o)=>new Date(t).toLocaleDateString('es-MX',o||{day:'numeric',month:'short'});
const edad=t=>{const m=Math.floor((ahora()-t)/(30.44*D));return m<12?m+(m===1?' mes':' meses'):Math.floor(m/12)+(Math.floor(m/12)===1?' año':' años')};
const telWa=t=>{t=String(t||'').replace(/\D/g,'');return t.length===10?'52'+t:t};
function toast(t,ms){document.querySelectorAll('.toast').forEach(e=>e.remove());const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),ms||2600)}
function wa(tel,txt){window.open('https://wa.me/'+telWa(tel)+'?text='+encodeURIComponent(txt),'_blank')}
const CID=(new URLSearchParams(location.search).get('c')||'estacion-veterinaria').replace(/[^a-z0-9-]/g,'');
let C=null,S=null,ui={tab:'hoy',q:'',dia:0};
const KEY='vet-demo-'+CID;
/* ---------- Datos de ejemplo ---------- */
function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function seed(){const r=rnd(7),pick=a=>a[Math.floor(r()*a.length)],now=ahora(),h0=hoy0();
 const nombres=['Mariana López','Jorge Ramírez','Lucía Hernández','Carlos Medina','Ana Sofía Ruiz','Roberto Castillo','Gabriela Torres','Miguel Ángel Soto','Daniela Flores','Fernando Aguilar','Patricia Gómez','Luis Navarro','Valeria Cruz','Ricardo Morales','Andrea Vega','Héctor Ortiz','Karen Díaz','Sergio Peña','Claudia Rivas','Alejandro Mejía','Paola Sánchez','Eduardo Lara','Mónica Salas','Iván Contreras'];
 const perros=[['Max','Labrador'],['Luna','Schnauzer'],['Rocky','Pitbull'],['Canela','Chihuahua'],['Toby','Poodle'],['Kira','Pastor alemán'],['Jack','Mestizo'],['Nala','Golden retriever'],['Bruno','Bulldog francés'],['Lola','Yorkshire'],['Coco','Shih tzu'],['Zeus','Husky'],['Mía','Beagle'],['Thor','Rottweiler'],['Princesa','Maltés'],['Simba','Mestizo'],['Chispa','Dachshund'],['Bobby','Border collie']];
 const gatos=[['Michi','Doméstico'],['Pelusa','Persa'],['Garfield','Doméstico naranja'],['Salem','Doméstico negro'],['Kiara','Siamés'],['Oliver','Doméstico'],['Mimi','Angora']];
 const duenos=nombres.map((n,i)=>({id:'d'+i,nombre:n,tel:'664'+String(1000000+Math.floor(r()*8999999)),desde:now-Math.floor(r()*700+30)*D}));
 const masc=[];let k=0;
 [...perros.map(x=>['Perro',...x]),...gatos.map(x=>['Gato',...x])].forEach(([esp,n,raza],i)=>{const d=duenos[i%duenos.length];const peso=esp==='Gato'?3+r()*3:({Chihuahua:2.5,Yorkshire:3,Maltés:3.5,Poodle:6,'Shih tzu':6,Schnauzer:8,Dachshund:7,'Bulldog francés':11,Beagle:12,Mestizo:14,'Border collie':17,Husky:22,Pitbull:25,Labrador:30,'Golden retriever':29,'Pastor alemán':33,Rottweiler:42}[raza]||12)*(0.9+r()*0.2);
  const nac=now-Math.floor(r()*(i%6===0?0.8:10)*365*D)-60*D;const pesos=[];for(let j=5;j>=0;j--)pesos.push([now-j*60*D-Math.floor(r()*20)*D,Math.round(peso*(1-j*0.012+r()*0.03)*10)/10]);
  masc.push({id:'m'+(k++),dueno:d.id,nombre:n,especie:esp,raza,sexo:r()<.5?'Macho':'Hembra',nac,esteril:r()<.6,alergias:i===3?'Penicilina':i===12?'Pollo (alimento)':'',pesos:pesos.filter(p=>p[0]>nac),color:pick(['café','negro','blanco','gris','dorado','atigrado','manchado'])})});
 const cons=[],vac=[],ventas=[];const motivos=[['Vómito y diarrea','Gastroenteritis','Dieta blanda 3 días, hidratación','Metronidazol'],['Cojea de la pata trasera','Esguince leve','Reposo 7 días','Meloxicam'],['Comezón y se rasca mucho','Dermatitis alérgica','Shampoo medicado, cambio de alimento','Prednisolona'],['Revisión general','Paciente sano','Vacunas al día','' ],['Tos','Traqueobronquitis','Evitar collar, reposo','Amoxicilina con clavulánico'],['No quiere comer','Gastritis','Omeprazol y dieta','Omeprazol'],['Herida en la oreja','Otitis externa','Limpieza de oídos','Enrofloxacino'],['Dolor al caminar (adulto mayor)','Artrosis','Control de peso, suplemento articular','Meloxicam']];
 for(let d=60;d>=1;d--){const t0=h0-d*D;const dow=new Date(t0).getDay();if(dow===0)continue;const n=2+Math.floor(r()*4);for(let j=0;j<n;j++){const m=pick(masc),mo=pick(motivos),t=t0+(9.5+r()*8.5)*36e5;const med=C.medicamentos.find(x=>x.n===mo[3]);const peso=m.pesos[m.pesos.length-1][1];
   const rx=med?[{med:med.n,mg:Math.round(peso*med[m.especie==='Gato'?'gato':'perro']*10)/10,ml:Math.round(peso*med[m.especie==='Gato'?'gato':'perro']/med.mgml*100)/100,frec:med.frec,dias:med.dias,via:med.via}]:[];
   const cobro=[['Consulta general',350]];if(r()<.25)cobro.push(['Ultrasonido',750]);if(med&&r()<.6){const p=C.productos.find(x=>x[0].startsWith(med.n.split(' ')[0])&&x[5]>0);if(p)cobro.push([p[0],p[5]])}
   const c={id:uid(),mid:m.id,t,motivo:mo[0],peso,temp:(38+r()*1.2).toFixed(1),fc:Math.floor(80+r()*60),fr:Math.floor(18+r()*16),expl:'Mucosas rosadas, hidratación adecuada.',dx:mo[1],plan:mo[2],rx,doc:r()<.7?C.doctor:'Dra. Ana López',cobro};cons.push(c);
   ventas.push({id:uid(),t:t+20*60000,mid:m.id,items:cobro.map(x=>[x[0],1,x[1]]),total:cobro.reduce((a,x)=>a+x[1],0),met:pick(['Efectivo','Efectivo','Tarjeta','Transferencia']),ref:c.id});}
   if(r()<.4){const m=pick(masc);const tipo=pick(C.vacunas[m.especie]);const pr=C.servicios.find(s=>s[0].toLowerCase().includes(tipo[0].split(' ')[0].toLowerCase().slice(0,6)))||['Vacuna',400];ventas.push({id:uid(),t:t0+12*36e5,mid:m.id,items:[[pr[0],1,pr[1]]],total:pr[1],met:'Efectivo'})}
   if(r()<.5){const p=pick(C.productos.filter(x=>x[5]>0&&x[1]==='Tienda'));ventas.push({id:uid(),t:t0+(10+r()*8)*36e5,items:[[p[0],1,p[5]]],total:p[5],met:pick(['Efectivo','Tarjeta'])})}}
 masc.forEach((m,i)=>{(C.vacunas[m.especie]).forEach(([tipo,cada],j)=>{if(tipo.includes('cachorro'))return;const hace=Math.floor(r()*cada*0.75);const t=now-hace*D;if(t<m.nac)return;vac.push({id:uid(),mid:m.id,t,tipo,lote:'L'+Math.floor(1000+r()*8999),prox:t+cada*D})})});
 // algunas que vencen esta semana para los recordatorios
 vac.slice(0,70).forEach((v,i)=>{if(i%10===0)v.prox=now+(1+i%5)*D;if(i%13===5)v.prox=now-(3+i%9)*D});
 const citas=[];const slots=[9.5,10,10.75,11.5,12.5,13,16,16.75,17.5,18.25];const mot=['Vacuna anual','Revisión de herida','Consulta: vómito','Ultrasonido','Desparasitación','Consulta: comezón','Control de peso','Baño y corte','Retiro de puntos','Primera consulta cachorro'];
 const hh=new Date().getHours()+new Date().getMinutes()/60;
 slots.forEach((h,i)=>{const m=masc[(i*7+3)%masc.length];const t=h0+h*36e5;citas.push({id:uid(),mid:m.id,t,dur:30,motivo:mot[i],estado:h<hh-1?(i===2?'falto':'termino'):h<hh?'consulta':i%3===0?'confirmada':'agendada'})});

 ctMot:d=>{$('#ct-m').value=d.v},
 citaOk:()=>{const mid=v('sel-m'),f=v('ct-d'),h=v('ct-h');if(!f||!h){toast('Elige día y hora');return}S.citas.push({id:uid(),mid,t:new Date(f+'T'+h).getTime(),dur:30,motivo:v('ct-m')||'Consulta',estado:'agendada'});guardar();cerrar();toast('Cita agendada');render()},
 cita_confirmar:d=>{const c=S.citas.find(x=>x.id===d.c),m=mDe(c.mid),du=dDe(m.dueno);wa(du.tel,`Hola ${du.nombre.split(' ')[0]}, le recordamos la cita de ${m.nombre} ${dk(c.t)===dk(ahora())?'hoy':'el '+fecha(c.t,{weekday:'long',day:'numeric'})} a las ${hora(c.t)} en ${C.nombre} (${C.direccion}). ¿Nos confirma? 🐾`);c.estado='confirmada';guardar();setTimeout(render,400)},
 cita_llego:d=>{S.citas.find(x=>x.id===d.c).estado='llego';guardar();render();toast('En sala de espera')},
 cita_consultar:d=>{const c=S.citas.find(x=>x.id===d.c);c.estado='consulta';guardar();render();ui.rx=[];ui.cob=['Consulta general'];ui.cm=c.mid;mConsulta(mDe(c.mid))},
 recVac:d=>{const x=S.vac.find(y=>y.id===d.v),m=mDe(x.mid),du=dDe(m.dueno),venc=x.prox<ahora();wa(du.tel,`Hola ${du.nombre.split(' ')[0]}, le saludamos de ${C.nombre} 🐾. ${venc?'A '+m.nombre+' ya le toca':'A '+m.nombre+' le toca'} su ${x.tipo.toLowerCase()} ${venc?'(venció el '+fecha(x.prox,{day:'numeric',month:'long'})+')':'el '+fecha(x.prox,{day:'numeric',month:'long'})}. ¿Le agendamos una cita? Tenemos espacio esta semana.`);S.avisos['v'+x.id]=ahora();guardar();setTimeout(render,400)},
 segui:d=>{const c=S.cons.find(x=>x.id===d.c),m=mDe(c.mid),du=dDe(m.dueno);wa(du.tel,`Hola ${du.nombre.split(' ')[0]}, ¿cómo sigue ${m.nombre}? Queremos saber cómo va con el tratamiento. Si le gustó la atención, nos ayudaría mucho su opinión en Google: ${C.resenaGoogle} 🐾 — ${C.nombre}`);S.avisos['s'+c.id]=ahora();guardar();setTimeout(render,400)},
 resurtir:d=>{const c=S.cons.find(x=>x.id===d.c),m=mDe(c.mid),du=dDe(m.dueno);wa(du.tel,`Hola ${du.nombre.split(' ')[0]}, el tratamiento de ${m.nombre} (${c.rx.map(x=>x.med).join(', ')}) termina en 2 días. ¿Cómo lo ve? Si quiere, le preparamos más o le agendamos su revisión. — ${C.nombre}`);S.avisos['r'+c.id]=ahora();guardar();setTimeout(render,400)},
 cartilla:d=>{const m=mDe(d.m),du=dDe(m.dueno),ult={};S.vac.filter(x=>x.mid===m.id).sort((a,b)=>b.t-a.t).forEach(x=>{if(!ult[x.tipo])ult[x.tipo]=x});wa(du.tel,`Cartilla de ${m.nombre} 🐾 (${C.nombre})\n\n${Object.values(ult).map(x=>`• ${x.tipo}: aplicada ${fecha(x.t,{day:'numeric',month:'short',year:'numeric'})}, próxima ${fecha(x.prox,{day:'numeric',month:'short',year:'numeric'})}`).join('\n')}\n\nPeso actual: ${pesoDe(m)} kg`)},
 waDueno:d=>{const du=dDe(d.d);wa(du.tel,`Hola ${du.nombre.split(' ')[0]}, le escribimos de ${C.nombre}. `)},
 consent:d=>{ui.ctp='Cirugía';mConsent(mDe(d.m))},
 ctp:d=>{ui.ctp=d.t;mConsent(mDe(d.m))},
 firmaBorrar:()=>{const c=$('#firma');c.getContext('2d').clearRect(0,0,c.width,c.height);ui.firmo=false},
 consentOk:d=>{if(!ui.firmo){toast('Falta la firma del dueño');return}const m=mDe(d.m);S.firmas.push({id:uid(),mid:m.id,t:ahora(),tipo:ui.ctp,nombre:dDe(m.dueno).nombre,firma:$('#firma').toDataURL('image/png')});guardar();ui.ft='arch';modal(fichaHtml(m));toast('Consentimiento firmado y guardado en su expediente')},
 tarea:d=>{const x=S.hosp.find(y=>y.id===d.h),k=dk(ahora()),a=x.hechas[k]=x.hechas[k]||[],i=+d.i,j=a.indexOf(i);j<0?a.push(i):a.splice(j,1);guardar();render()},
 avisoHosp:d=>{const x=S.hosp.find(y=>y.id===d.h),m=mDe(x.mid),du=dDe(m.dueno);wa(du.tel,`Hola ${du.nombre.split(' ')[0]}, le compartimos cómo va ${m.nombre} 🐾\n\n${x.notas||'Está estable y comiendo poco a poco.'}\n\nLe mandamos una foto en un momento. — ${C.nombre}`)},
 alta:d=>{const x=S.hosp.find(y=>y.id===d.h),dias=Math.max(1,Math.ceil((ahora()-x.ingreso)/D));x.alta=ahora();S.abiertas.push({id:uid(),mid:x.mid,items:[['Hospitalización (día)',dias,650]]});guardar();render();toast('Alta lista. La cuenta está en Caja.')},
 internar:()=>{modal(`<h2>Internar paciente</h2><label>Paciente</label>${selMascota()}<label for="in-m">Motivo</label><input id="in-m" type="text"><label for="in-j">Jaula</label><input id="in-j" type="text" value="Jaula 2"><div class="acts" style="margin-top:16px"><button class="btn" data-a="cerrar">Cancelar</button><span class="sp"></span><button class="btn pri" data-a="internarOk">Internar</button></div>`)},
 internarOk:()=>{S.hosp.push({id:uid(),mid:v('sel-m'),ingreso:ahora(),motivo:v('in-m')||'Observación',jaula:v('in-j')||'Jaula',tareas:[['08:00','Revisar signos'],['14:00','Medicamento'],['20:00','Revisar signos']],hechas:{},notas:''});guardar();cerrar();render()},
 cobrar:d=>{const a=S.abiertas.find(x=>x.id===d.i),m=mDe(a.mid),t=a.items.reduce((s,x)=>s+x[1]*x[2],0);modal(`<h2>Cobrar ${money(t)}</h2><p class="sub">${esc(m.nombre)} · ${esc(dDe(m.dueno).nombre)}</p><table class="tbl">${a.items.map(x=>`<tr><td>${esc(x[0])}${x[1]>1?' × '+x[1]:''}</td><td class="num r">${money(x[1]*x[2])}</td></tr>`).join('')}</table><div class="acts" style="margin-top:16px">${['Efectivo','Tarjeta','Transferencia'].map(mt=>`<button class="btn ${mt==='Efectivo'?'ok':''}" data-a="cobrarOk" data-i="${a.id}" data-m="${mt}">${mt}</button>`).join('')}</div>`)},
 cobrarOk:d=>{const a=S.abiertas.find(x=>x.id===d.i);const t=a.items.reduce((s,x)=>s+x[1]*x[2],0);a.items.forEach(([n,q])=>{const p=S.prods.find(x=>x.nombre===n);if(p)p.stock=Math.max(0,p.stock-q)});S.ventas.push({id:uid(),t:ahora(),mid:a.mid,items:a.items,total:t,met:d.m,ref:a.ref});S.abiertas=S.abiertas.filter(x=>x.id!==a.id);guardar();cerrar();render();toast('Cobrado '+money(t)+' · '+d.m)},
 venta:()=>{ui.vta=[];mVenta()},vtaAdd:d=>{ui.vta.push(d.p);const y=$('.sheet').scrollTop;mVenta();$('.sheet').scrollTop=y},
 vtaOk:d=>{const it={};ui.vta.forEach(id=>it[id]=(it[id]||0)+1);const items=Object.entries(it).map(([id,q])=>{const p=S.prods.find(x=>x.id===id);p.stock=Math.max(0,p.stock-q);return [p.nombre,q,p.precio]});const t=items.reduce((s,x)=>s+x[1]*x[2],0);S.ventas.push({id:uid(),t:ahora(),items,total:t,met:d.m});guardar();cerrar();render();toast('Venta cobrada: '+money(t))},
 corte:()=>{const h0=hoy0(),V=S.ventas.filter(x=>x.t>=h0),ef=V.filter(x=>x.met==='Efectivo').reduce((a,x)=>a+x.total,0);modal(`<h2>Corte de caja</h2><p class="sub">Debe haber <b>${money(ef)}</b> en efectivo (más el fondo).</p><label for="co-e">¿Cuánto hay en el cajón, sin el fondo?</label><input id="co-e" type="number" inputmode="decimal"><div class="acts" style="margin-top:14px"><span class="sp"></span><button class="btn pri" data-a="corteOk" data-e="${ef}">Ver resultado</button></div>`)},
 corteOk:d=>{const c=+v('co-e'),e=+d.e,dif=c-e;toast(Math.abs(dif)<1?'✓ Cuadra perfecto':dif>0?'Sobran '+money(dif):'Faltan '+money(-dif),4500);cerrar()},
 nuevoPaciente:()=>mNuevoPaciente(),
 npOk:()=>{if(!v('np-n')||!v('np-d')){toast('Falta el nombre de la mascota o del dueño');return}const d={id:uid(),nombre:v('np-d'),tel:v('np-t'),desde:ahora()};S.duenos.push(d);const m={id:uid(),dueno:d.id,nombre:v('np-n'),especie:v('np-e'),raza:v('np-r')||'Mestizo',sexo:v('np-s'),nac:ahora()-(+v('np-ed')||1)*365*D,esteril:false,alergias:v('np-a'),pesos:v('np-p')?[[ahora(),+v('np-p')]]:[],color:''};S.masc.push(m);guardar();render();ui.ft='hist';modal(fichaHtml(m));toast('Paciente guardado')},
 meInteresa:()=>{const r=new URLSearchParams(location.search).get('ref');wa('526862595403',`Hola, vi la demostración del sistema para ${C.nombre} y me interesa. ¿Me pueden dar más información?${r?' (Me la enseñó: '+r+')':''}`)},
 cierre:d=>{S.cierre=S.cierre||{};const k=dk(ahora())+d.i;S.cierre[k]=!S.cierre[k];guardar();render()}
};
/* ---------- Render ---------- */
function nav(){const it=TABS.map(([k,l])=>{const b=badge(k);return `<button class="${ui.tab===k?'on':''}" data-a="tab" data-t="${k}">${ICON[k]}<span>${l}</span>${b?`<i class="dot">${b}</i>`:''}</button>`});
 $('#side').innerHTML=`<div class="brand"><img src="${esc(C.logo)}" alt=""><div><b>${esc(C.nombre)}</b><small>${esc(C.doctor)}</small></div></div>`+it.join('');
 const mob=['hoy','agenda','pacientes','hospital','caja'];$('#tabs').innerHTML=TABS.filter(([k])=>mob.includes(k)).map(([k,l])=>{const b=badge(k);return `<button class="${ui.tab===k?'on':''}" data-a="tab" data-t="${k}">${ICON[k]}<span>${l}</span>${b?`<i class="dot">${b}</i>`:''}</button>`}).join('')+`<button class="${['farmacia','resumen'].includes(ui.tab)?'on':''}" data-a="mas">${ICON.mas}<span>Más</span></button>`;
 $('#top').innerHTML=`<img src="${esc(C.logo)}" alt=""><div><b>${esc(C.nombre)}</b><small>${esc(C.lema)}</small></div><span class="sp"></span>`}
A.mas=()=>modal(`<h2>Más</h2><div class="list" style="margin-top:10px">${[['farmacia','Farmacia y tienda','Existencias y caducidades'],['resumen','Resumen del mes','Ingresos, consultas y cierre del día']].map(([k,t,s])=>`<button class="item" data-a="tab" data-t="${k}"><div class="av">${ICON[k]}</div><div class="t"><b>${t}</b><span>${s}</span></div></button>`).join('')}</div>`);
function render(){nav();$('#main').innerHTML={hoy:vHoy,agenda:vAgenda,pacientes:vPacientes,hospital:vHospital,caja:vCaja,farmacia:vFarmacia,resumen:vResumen}[ui.tab]();document.title=C.nombre}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=A[b.dataset.a];if(!f)return;if(b.dataset.a==='consulta'||b.dataset.a==='cita_consultar')ui.cm=b.dataset.m||ui.cm;f(b.dataset,e)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){ui.q=t.value;const p=t.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}if(t.id==='c-peso'&&ui.cm)pintarRx(mDe(ui.cm))});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='arch-in'){const m=mDe(t.dataset.m);m.archivos=m.archivos||[];[...t.files].slice(0,4).forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,640/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);m.archivos.push({n:f.name.replace(/\.[^.]+$/,''),t:ahora(),src:c.toDataURL('image/jpeg',.75)});guardar();ui.ft='arch';modal(fichaHtml(m))};im.src=r.result};r.readAsDataURL(f)})}});
fetch('c/'+CID+'.json',{cache:'no-cache'}).then(r=>r.json()).then(c=>{C=c;document.documentElement.style.setProperty('--brand',C.color);C.logo=C.logo||'../icono-192.png';S=cargar();guardar();render()}).catch(()=>{$('#main').innerHTML='<div class="empty">No se pudo abrir esta demostración.</div>'});
</script>
</body>
</html>
