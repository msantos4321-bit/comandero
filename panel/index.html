<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Comandero · Panel</title>
<meta name="theme-color" content="#151210">
<meta name="robots" content="noindex">
<link rel="icon" href="../icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Panel del dueño: mismo carbón y brasa del Comandero. Lista de restaurantes como tarjetas con su estado de pago a la vista. */
:root{
  --bg:#EEEBE7;--surface:#FFFFFF;--surface2:#F7F5F2;--ink:#1A1715;--muted:#6B635C;--line:#DDD7D0;--chip:#E7E2DC;
  --bar:#151210;--bar-ink:#F4EFE8;--brand:#E8622C;--brand-ink:#FFFFFF;--brand-deep:#B4431A;
  --ok:#1F7A4B;--ok-soft:#DCF0E3;--warn:#B26B00;--warn-soft:#FCEACB;--bad:#B8322A;--bad-soft:#F8DEDC;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Figtree","Segoe UI",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12100E;--surface:#1C1916;--surface2:#24201C;--ink:#F4EFE8;--muted:#A29890;--line:#332D28;--chip:#2A2521;--bar:#0B0A09;--brand-deep:#F08A5D;
  --ok:#4CC383;--ok-soft:#15301F;--warn:#E8A23A;--warn-soft:#382A13;--bad:#F0675D;--bad-soft:#3A1B19;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12100E;--surface:#1C1916;--surface2:#24201C;--ink:#F4EFE8;--muted:#A29890;--line:#332D28;--chip:#2A2521;--bar:#0B0A09;--brand-deep:#F08A5D;
  --ok:#4CC383;--ok-soft:#15301F;--warn:#E8A23A;--warn-soft:#382A13;--bad:#F0675D;--bad-soft:#3A1B19;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;line-height:1;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
[hidden]{display:none!important}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);border-bottom:3px solid var(--brand)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bar)}
.in{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:11px;background:var(--brand);display:grid;place-items:center;flex:none}
.mark svg{width:24px;height:24px}
header h1{font-size:24px}
header small{display:block;opacity:.65;font-size:12.5px}
.sp{flex:1}
main{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 80px;display:grid;gap:18px}
.btn{min-height:46px;padding:0 16px;border-radius:12px;background:var(--chip);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.bar{background:rgba(255,255,255,.12);color:var(--bar-ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lbl{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:2px}
.kpi .v{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.kpi.alert .v{color:var(--bad)}
.list{display:grid;gap:12px}
.rest{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:16px;align-items:center}
.rest.pausado{opacity:.7}
@media(max-width:760px){.rest{grid-template-columns:1fr}}
.rest h3{font-size:28px}
.rest .id{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.facts b{display:block;font-family:var(--display);font-size:22px;font-weight:700;line-height:1.05}
.facts span{font-size:12.5px;color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:8px;min-width:150px}
@media(max-width:760px){.acts{flex-direction:row;flex-wrap:wrap}.acts .btn{flex:1}}
.empty{padding:30px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:16px}
.login{max-width:440px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:14px}
.login h2{font-size:34px}
/* Hoja lateral */
.ov{position:fixed;inset:0;background:rgba(10,10,10,.55);z-index:50;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:16px;align-content:start}
.sheet h2{font-size:32px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
label{display:grid;gap:4px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw small{display:block;color:var(--muted);font-size:12.5px}
.tog{width:52px;height:30px;border-radius:99px;background:var(--chip);position:relative;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.tog.on{background:var(--ok)}.tog.on::after{left:25px}
.code{font:800 22px var(--display);letter-spacing:.06em;background:var(--chip);border-radius:10px;padding:10px 12px;text-align:center;user-select:all}
.link{font-size:12.5px;word-break:break-all;background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;user-select:all}
.pagos{display:grid;gap:4px;font-size:13.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--bar);color:var(--bar-ink);padding:12px 18px;border-radius:12px;font-weight:700;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.note{font-size:13.5px;color:var(--muted);background:var(--chip);border-radius:10px;padding:10px 12px}
.note.warn{background:var(--warn-soft);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.cli{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.cli h3{font-size:24px}
.grupo{display:grid;gap:10px;border-left:4px solid var(--brand);padding-left:12px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{padding:9px 14px;border-radius:99px;background:var(--chip);font-weight:700;min-height:42px}
.opt.on{background:var(--brand);color:var(--brand-ink)}
</style>
</head><body>
<header><div class="in"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17h16M6 17a6 6 0 0 1 12 0M12 8V6M10 6h4"/><path d="M3 20h18"/></svg></span><div><h1>Comandero</h1><small>Panel del dueño</small></div><span class="sp"></span><button class="btn bar sm" id="btnSalir" hidden>Salir</button></div></header>
<main id="app"></main>
<div id="sheet"></div>
<script>
const NUBE={url:'https://wnwecaapchcfhcljsvli.supabase.co',key:'sb_publishable_vnkSLd5EzN53_LBv76YxUA_QRo2u8ok'};
const APP='https://msantos4321-bit.github.io/comandero/';
const FEAT=[['llevar','Para llevar','Órdenes para recoger'],['domicilio','Domicilio','Con dirección y costo de envío'],['uber','Uber Eats','Pedidos de la plataforma'],['didi','DiDi Food','Pedidos de la plataforma'],
  ['promociones','Promociones','Descuentos, paquetes y cortesías'],['asistencia','Horarios y asistencia','Checada con PIN, retardos y faltas'],['impresion','Imprimir ticket','Botón en Caja'],['graficas','Gráficas de ventas','Semana y hora fuerte en el resumen']];
const PRECIO={base:399,extra:299,mesesAnual:10};
const anual=p=>(p||{}).cobro==='anual';
const mensualEq=r=>{const p=r.plan||{},m=+p.mensualidad||0;return anual(p)?m*PRECIO.mesesAnual/12:m};
const montoPago=p=>(+p.mensualidad||0)*(anual(p)?PRECIO.mesesAnual:1);
const slug=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
function grupos(){const G=[];R.forEach(r=>{const k=r.grupo||('c-'+r.id);let g=G.find(x=>x.id===k);if(!g)G.push(g={id:k,nombre:'',locales:[]});g.locales.push(r);if(!g.nombre&&(r.plan||{}).cliente)g.nombre=r.plan.cliente});G.forEach(g=>{if(!g.nombre)g.nombre=g.locales[0].nombre});return G}
let K='';try{K=localStorage.getItem('comandero-dueno')||''}catch(e){}
let R=[],ed=null,cargando=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(+n||0).toLocaleString('es-MX');
const hoyISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fFecha=s=>s?new Date(s+'T12:00').toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'}):'—';
const hace=t=>{if(!t)return 'Sin uso todavía';const m=Math.round((Date.now()-new Date(t))/60000);return m<2?'En uso ahora':m<60?'Hace '+m+' min':m<1440?'Hace '+Math.round(m/60)+' h':'Hace '+Math.round(m/1440)+' días'};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function rpc(fn,args){return fetch(NUBE.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:NUBE.key,'Content-Type':'application/json'},body:JSON.stringify(args),cache:'no-store'})
  .then(async r=>{const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&(j.message||j.hint))||('Error '+r.status));return j})}
function pago(r){const p=r.plan||{};if(r.estado==='pausado')return['Pausado','bad'];if(!p.pagado_hasta)return['Sin fecha de pago',''];const dias=Math.round((new Date(p.pagado_hasta+'T12:00')-new Date(hoyISO()+'T12:00'))/864e5);
  return dias<0?['Vencido hace '+(-dias)+' día'+(dias===-1?'':'s'),'bad']:dias<=5?['Vence en '+dias+' día'+(dias===1?'':'s'),'warn']:['Al corriente','ok']}
const liga=r=>APP+'?r='+encodeURIComponent(r.id)+'&k='+encodeURIComponent(r.code||'');
function msgWA(r){return `Hola${r.plan&&r.plan.contacto?' '+r.plan.contacto.split(' ')[0]:''}. Ya está listo el Comandero de *${r.nombre}*.\n\nEn cada tablet o celular del restaurante abre esta liga y toca «Instalar app»:\n${liga(r)}\n\nSi te lo pide a mano:\nRestaurante: ${r.id}\nCódigo: ${r.code}\n\nPrimero entra como Gerente (PIN 1234) y cambia todos los PIN en «Equipo y PIN». Comparte la liga solo con tu equipo.`}
function waURL(r){const t=(r.plan&&r.plan.telefono||'').replace(/\D/g,'');const n=t.length===10?'52'+t:t;return 'https://wa.me/'+(n||'')+'?text='+encodeURIComponent(msgWA(r))}
async function copiar(t,ok){try{await navigator.clipboard.writeText(t);toast(ok)}catch(e){toast('Mantén presionado el texto para copiarlo')}}

async function cargar(){if(!K)return render();cargando=true;render();try{R=(await rpc('cm_admin_list',{p_s:K})||[]).filter(r=>!(r.features&&r.features.prueba))}catch(e){if(/llave/i.test(e.message)){K='';try{localStorage.removeItem('comandero-dueno')}catch(_){};toast(e.message)}else toast('No se pudo cargar: '+e.message)}cargando=false;render();altaDesdeLiga()}
let altaHecha=false;async function altaDesdeLiga(){if(altaHecha||!K)return;let a='';try{a=(new URLSearchParams(location.search).get('alta')||'').toLowerCase()}catch(e){}if(!/^[a-z0-9-]{3,30}$/.test(a))return;altaHecha=true;history.replaceState(null,'',location.pathname);
  if(R.some(x=>x.id===a)){ed={tipo:'qr',id:a};sheet();return}
  let P=null;try{const r=await fetch('../p/'+a+'.json',{cache:'no-store'});if(r.ok)P=await r.json()}catch(e){}
  if(!P){toast('No encontré la demo preparada «'+a+'»');return}
  ed={tipo:'nuevo',pre:{id:a,nombre:P.nombre}};sheet();const pl=$('#nPla');if(pl)pl.value='preparada'}
function render(){
  $('#btnSalir').hidden=!K;
  const app=$('#app');
  if(!K){app.innerHTML=`<form class="login" id="fLogin"><p class="lbl">Solo para el dueño</p><h2>Entrar al panel</h2><p class="muted" style="margin:0">Escribe tu llave de dueño. Te llegó por correo; este aparato la recordará.</p><label><span class="lbl">Llave de dueño</span><input id="llave" autocomplete="off" autocapitalize="characters" placeholder="DUENO-XXXXX-XXXXX-XXXXX-XXXXX"></label><button class="btn pri" type="submit">Entrar</button></form>`;
    $('#fLogin').onsubmit=e=>{e.preventDefault();K=$('#llave').value.trim().toUpperCase();try{localStorage.setItem('comandero-dueno',K)}catch(_){}cargar()};return}
  if(cargando&&!R.length){app.innerHTML=`<div class="empty">Cargando restaurantes…</div>`;return}
  const act=R.filter(r=>r.estado==='activo'),ing=act.reduce((a,r)=>a+mensualEq(r),0),venc=R.filter(r=>pago(r)[1]==='bad'&&r.estado==='activo'),vm=R.reduce((a,r)=>a+(+r.venta_mes||0),0),G=grupos(),nCli=G.filter(g=>g.locales.some(r=>r.estado==='activo')).length,apH=R.reduce((a,r)=>a+(+r.aparatos_hoy||0),0);
  let h=`<section class="kpis"><div class="kpi"><span class="v num">${act.length}</span><span class="muted">Locales activos · ${nCli} cliente${nCli===1?'':'s'}</span></div><div class="kpi"><span class="v num">${money(ing)}</span><span class="muted">Ingreso mensual</span></div><div class="kpi ${venc.length?'alert':''}"><span class="v num">${venc.length}</span><span class="muted">Con pago vencido</span></div><div class="kpi"><span class="v num">${apH}</span><span class="muted">Aparatos conectados hoy</span></div></section>
  <p class="muted" style="margin:0;font-size:13.5px">Precio de lista: ${money(PRECIO.base)} al mes por local · cada local extra del mismo cliente ${money(PRECIO.extra)} · pago anual = ${PRECIO.mesesAnual} mensualidades por 12 meses · aparatos y usuarios ilimitados. Tus clientes vendieron ${money(vm)} este mes.</p>
  <div class="row"><h2 style="font-size:30px">Restaurantes</h2><span class="sp"></span><button class="btn ghost sm" data-a="recargar">Actualizar</button><button class="btn pri" data-a="nuevo">+ Nuevo restaurante</button></div><section class="list">`;
  if(!R.length)h+=`<div class="empty">Todavía no hay restaurantes. Toca «Nuevo restaurante» para dar de alta el primero.</div>`;
  const tarjeta=r=>{const [pt,pc]=pago(r),p=r.plan||{};
    return `<article class="rest ${r.estado}"><div><h3>${esc(r.nombre)}</h3><div class="id">${esc(r.id)}${p.contacto?' · '+esc(p.contacto):''}${p.telefono?' · '+esc(p.telefono):''}</div><div class="chips"><span class="chip ${pc}">${esc(pt)}</span><span class="chip">${esc(hace(r.ultimo))}</span><span class="chip">${+r.aparatos_hoy||0} aparato${+r.aparatos_hoy===1?'':'s'} hoy</span>${anual(p)?'<span class="chip ok">Pago anual</span>':''}${FEAT.filter(([k])=>(r.features||{})[k]===false).length?`<span class="chip">${FEAT.filter(([k])=>(r.features||{})[k]===false).length} funciones apagadas</span>`:''}</div></div>
    <div class="facts"><div><b class="num">${p.mensualidad?money(montoPago(p)):'—'}</b><span>${anual(p)?'Al año':'Al mes'}</span></div><div><b>${fFecha(p.pagado_hasta)}</b><span>Pagado hasta</span></div><div><b class="num">${money(r.venta_mes)}</b><span>Ventas del mes</span></div><div><b class="num">${r.cuentas_mes||0}</b><span>Cuentas cobradas</span></div></div>
    <div class="acts"><button class="btn sm ok" data-a="verQR" data-id="${esc(r.id)}">QR para instalar</button><button class="btn sm" data-a="editar" data-id="${esc(r.id)}">Administrar</button><a class="btn sm ghost" href="${esc(waURL(r))}" target="_blank" rel="noopener">Liga por WhatsApp</a></div></article>`};
  G.forEach(g=>{if(g.locales.length<2){h+=tarjeta(g.locales[0]);return}const tot=g.locales.filter(r=>r.estado==='activo').reduce((a,r)=>a+mensualEq(r),0);
    h+=`<div class="grupo"><div class="cli"><p class="lbl">Cliente</p><h3>${esc(g.nombre)}</h3><span class="muted">${g.locales.length} locales · ${money(tot)} al mes</span><span class="sp"></span><button class="btn sm ghost" data-a="nuevoEn" data-g="${esc(g.id)}">+ Otro local de este cliente</button></div>${g.locales.map(tarjeta).join('')}</div>`});
  app.innerHTML=h+`</section><p class="note">La liga de cada restaurante lleva su código: quien la tenga entra a ese restaurante. Si un empleado se va o la liga se comparte de más, usa «Código nuevo».</p>`;
}
function selCliente(sel,idSel){const G=grupos();return `<label><span class="lbl">Cliente (dueño)</span><select id="${idSel}"><option value="">Cliente nuevo</option>${G.map(g=>`<option value="${esc(g.id)}" ${g.id===sel?'selected':''}>${esc(g.nombre)} · ${g.locales.length} local${g.locales.length===1?'':'es'}</option>`).join('')}</select></label>`}
function selCobro(v,idSel){return `<label><span class="lbl">Cobro</span><select id="${idSel}"><option value="mensual" ${v!=='anual'?'selected':''}>Mensual</option><option value="anual" ${v==='anual'?'selected':''}>Anual (${PRECIO.mesesAnual} meses por 12)</option></select></label>`}
let qrLib=null;function qrCargar(){if(window.qrcode)return Promise.resolve();if(qrLib)return qrLib;qrLib=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});return qrLib}
function qrPintar(){const b=document.getElementById('qrBox');if(!b)return;qrCargar().then(()=>{const q=qrcode(0,'M');q.addData(b.dataset.t);q.make();b.innerHTML=q.createSvgTag({cellSize:7,margin:2,scalable:true})}).catch(()=>{b.innerHTML='<p class="muted">Sin internet para dibujar el QR. Usa los botones.</p>'})}
const mailURL=r=>'mailto:?subject='+encodeURIComponent('Comandero · '+r.nombre)+'&body='+encodeURIComponent('Abre esta liga en cada tablet y celular del restaurante y toca «Instalar app»:\n'+liga(r)+'\n\nPIN inicial del gerente: 1234 (cámbialo en Equipo y PIN).');
function cajaInstalar(r){return `<div class="box" style="text-align:center"><p class="lbl">Instalar ${esc(r.nombre)}</p><div id="qrBox" data-t="${esc(liga(r))}" style="width:min(260px,70vw);margin:4px auto;background:#fff;border-radius:12px;padding:6px"></div>
  <p style="margin:0">Apunta la <b>cámara</b> de cada tablet o celular a este código, abre la liga y toca <b>«Instalar app»</b>. Entran como Gerente con <b>1234</b>.</p>
  <div class="row" style="justify-content:center;flex-wrap:wrap"><a class="btn ok" href="${esc(waURL(r))}" target="_blank" rel="noopener">WhatsApp</a><a class="btn" href="${esc(mailURL(r))}">Correo</a><button class="btn" data-a="copiarLiga">Copiar liga</button><a class="btn ghost" href="${esc(liga(r))}" target="_blank" rel="noopener">Abrir aquí</a></div>
  <div class="code" style="font-size:20px">${esc(r.code||'')}</div><p class="muted" style="margin:0;font-size:13px">Código del restaurante, por si alguien lo escribe a mano en «Conectar mi restaurante».</p></div>`}
function sheet(){
  const el=$('#sheet');if(!ed){el.innerHTML='';document.body.style.overflow='';return}document.body.style.overflow='hidden';
  let h='';
  if(ed.tipo==='qr'){const r=R.find(x=>x.id===ed.id);h=`<div class="row"><p class="lbl">Instalar</p><span class="sp"></span><button class="btn ghost sm" data-a="cerrar">Cerrar</button></div><h2>${esc(r?r.nombre:'')}</h2>${r?cajaInstalar(r):''}`}
  else if(ed.tipo==='nuevo'){h=`<div class="row"><p class="lbl">Alta</p><span class="sp"></span><button class="btn ghost sm" data-a="cerrar">Cerrar</button></div><h2>Nuevo restaurante</h2>
    ${ed.code?`<p class="lbl" style="color:var(--ok)">✓ Dado de alta. ${ed.r.features.plantilla==='preparada'?'Arranca con el menú de su demo preparada.':ed.r.features.plantilla==='ejemplo'?'Arranca con el menú de ejemplo para que lo cambien.':'Arranca en blanco: el gerente captura su menú en «Menú y precios».'}</p>${cajaInstalar(Object.assign({},ed.r,{code:ed.code}))}`:
    `<form class="box" id="fNuevo"><label><span class="lbl">Nombre del restaurante</span><input id="nNom" required placeholder="Ej. Tacos El Güero" autocomplete="off" value="${esc((ed.pre||{}).nombre||'')}"></label>
    <label><span class="lbl">Identificador (va en la liga)</span><input id="nId" ${ed.pre?'data-touch="1"':''} value="${esc((ed.pre||{}).id||'')}" required pattern="[a-z0-9][a-z0-9\\-]{2,29}" placeholder="tacos-el-guero" autocomplete="off" autocapitalize="none"></label>
    ${selCliente(ed.grupo||'','nGru')}<label id="nCliBox" ${ed.grupo?'hidden':''}><span class="lbl">Nombre del cliente</span><input id="nCli" placeholder="Ej. Juan Pérez o Grupo El Güero" autocomplete="off" value="${esc((ed.pre||{}).nombre||'')}"></label>
    <div class="grid2"><label><span class="lbl">Contacto</span><input id="nCon" placeholder="Nombre del dueño"></label><label><span class="lbl">WhatsApp (10 dígitos)</span><input id="nTel" inputmode="tel" placeholder="664 123 4567"></label></div>
    <div class="grid2">${selCobro('mensual','nCob')}<label><span class="lbl">Mensualidad</span><input id="nMen" type="number" inputmode="numeric" value="${ed.grupo?PRECIO.extra:PRECIO.base}"></label></div>
    <p class="muted" id="nPrecio" style="margin:0;font-size:13px">${ed.grupo?'Local extra de un cliente: '+money(PRECIO.extra)+' al mes.':'Primer local: '+money(PRECIO.base)+' al mes.'} Instalación, personalización y el primer mes gratis.</p>
    <label><span class="lbl">Pagado hasta (el mes gratis)</span><input id="nHasta" type="date" value="${(()=>{const d=new Date();d.setMonth(d.getMonth()+1);return d.toISOString().slice(0,10)})()}"></label>
    <label><span class="lbl">Cómo arranca</span><select id="nPla"><option value="blanco">En blanco (ellos capturan su menú)</option><option value="ejemplo">Con el menú de ejemplo (para que lo editen)</option><option value="preparada">Con el menú de su demo preparada (mismo identificador)</option></select></label>
    <button class="btn pri" type="submit" ${ed.enviando?'disabled':''}>${ed.enviando?'Creando…':'Dar de alta y generar código'}</button></form>`}`}
  else{const r=R.find(x=>x.id===ed.id);if(!r){ed=null;return sheet()}const p=Object.assign({},r.plan||{}),f=Object.assign({},r.features||{});ed.p=ed.p||p;ed.f=ed.f||f;ed.estado=ed.estado||r.estado;ed.nombre=ed.nombre??r.nombre;if(ed.grupo===undefined)ed.grupo=r.grupo||'c-'+r.id;
    const [pt,pc]=pago(Object.assign({},r,{plan:ed.p,estado:ed.estado}));
    h=`<div class="row"><span class="chip ${pc}">${esc(pt)}</span><span class="sp"></span><button class="btn ghost sm" data-a="cerrar">Cerrar</button></div><h2>${esc(r.nombre)}</h2>
    <div class="box"><p class="lbl">Cobro</p>${selCliente(ed.grupo,'eGru')}<label id="eCliBox" ${grupos().some(g=>g.id===ed.grupo)?'hidden':''}><span class="lbl">Nombre del cliente nuevo</span><input id="eCli" value="${esc(ed.cliNuevo||'')}" placeholder="Ej. Juan Pérez"></label>
      <div class="grid2">${selCobro(ed.p.cobro,'eCob')}<label><span class="lbl">Mensualidad</span><input id="eMen" type="number" inputmode="numeric" value="${esc(ed.p.mensualidad||'')}"></label></div><label><span class="lbl">Pagado hasta</span><input id="eHasta" type="date" value="${esc(ed.p.pagado_hasta||'')}"></label>
      <button class="btn ok" data-a="pagoMes">${anual(ed.p)?'Registrar pago de un año':'Registrar pago de un mes'}${ed.p.mensualidad?' ('+money(montoPago(ed.p))+')':''}</button>
      <p class="muted" style="margin:0;font-size:13px">Precio de lista: ${money(PRECIO.base)} el primer local, ${money(PRECIO.extra)} cada local extra del mismo cliente. Anual: ${PRECIO.mesesAnual} mensualidades por 12 meses.</p>
      ${(ed.p.pagos||[]).length?`<div class="pagos">${ed.p.pagos.slice(-6).reverse().map(x=>`<div class="row"><span class="num">${fFecha(x.fecha)}</span><span class="sp"></span><b class="num">${money(x.monto)}</b><span class="muted">hasta ${fFecha(x.hasta)}</span></div>`).join('')}</div>`:''}</div>
    <div class="box"><p class="lbl">Aparatos conectados</p><div class="row"><b class="num" style="font:800 30px var(--display)">${+r.aparatos_hoy||0}</b><span class="muted">hoy</span><span class="sp"></span><b class="num" style="font:800 30px var(--display)">${+r.aparatos||0}</b><span class="muted">en los últimos 30 días</span></div><p class="muted" style="margin:0;font-size:13px">Sin límite de aparatos: es solo para que sepas cuánto lo usan.</p></div>
    <div class="box"><p class="lbl">Funciones del restaurante</p>${FEAT.map(([k,t,d])=>`<div class="sw"><span><b>${t}</b><small>${d}</small></span><button class="tog ${ed.f[k]!==false?'on':''}" role="switch" aria-checked="${ed.f[k]!==false}" aria-label="${t}" data-a="feat" data-k="${k}"></button></div>`).join('')}</div>
    <div class="box"><p class="lbl">Datos</p><label><span class="lbl">Nombre</span><input id="eNom" value="${esc(ed.nombre)}"></label><div class="grid2"><label><span class="lbl">Contacto</span><input id="eCon" value="${esc(ed.p.contacto||'')}"></label><label><span class="lbl">WhatsApp</span><input id="eTel" inputmode="tel" value="${esc(ed.p.telefono||'')}"></label></div><label><span class="lbl">Notas</span><textarea id="eNot" rows="2">${esc(ed.p.notas||'')}</textarea></label></div>
    <div class="box"><p class="lbl">Acceso</p><div class="code">${esc(r.code||'—')}</div><div class="link">${esc(liga(r))}</div><div class="row"><a class="btn" style="flex:1" href="${esc(waURL(r))}" target="_blank" rel="noopener">Mandar por WhatsApp</a><button class="btn" style="flex:1" data-a="copiarLiga">Copiar liga</button></div>
      <button class="btn ghost" data-a="codigo">${ed.confCod?'Toca otra vez: todos los aparatos tendrán que conectarse de nuevo':'Código nuevo'}</button></div>
    <div class="box"><p class="lbl">Respaldos semanales</p><p class="muted" style="margin:0;font-size:13.5px">Cada domingo se guarda una copia de todo el restaurante. Se conservan las últimas 8.</p>${ed.respaldos?(ed.respaldos.length?`<div class="pagos">${ed.respaldos.map(b=>`<div class="row"><span class="num">${new Date(b.fecha).toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</span><span class="muted">${b.kb} KB</span><span class="sp"></span><button class="btn sm" data-a="bajarResp" data-b="${b.id}">Descargar</button></div>`).join('')}</div>`:'<p class="muted" style="margin:0">Todavía no hay respaldos.</p>'):`<button class="btn" data-a="verResp">Ver respaldos</button>`}</div>
    <div class="box"><p class="lbl">Servicio</p><p class="muted" style="margin:0;font-size:13.5px">${ed.estado==='activo'?'Si lo pausas, sus aparatos muestran un aviso y dejan de funcionar hasta que lo actives. No se borra nada.':'Está pausado. Al activarlo, sus aparatos vuelven a funcionar con todos sus datos.'}</p><button class="btn ${ed.estado==='activo'?'bad':'ok'}" data-a="estado">${ed.estado==='activo'?'Pausar servicio':'Activar servicio'}</button></div>
    <button class="btn pri" data-a="guardar" ${ed.guardando?'disabled':''}>${ed.guardando?'Guardando…':'Guardar cambios'}</button>`}
  el.innerHTML=`<div class="ov" data-a="ovClose"><aside class="sheet" role="dialog" aria-modal="true">${h}</aside></div>`;qrPintar();
  const eg=$('#eGru');if(eg)eg.onchange=()=>{leerForm();sheet()};const ec=$('#eCob');if(ec)ec.onchange=()=>{leerForm();sheet()};
  const fn=$('#fNuevo');if(fn){const nom=$('#nNom'),id=$('#nId'),gru=$('#nGru'),men=$('#nMen');const revDemo=async()=>{const v=id.value.trim(),pl=$('#nPla');if(!/^[a-z0-9-]{3,30}$/.test(v))return;try{const r=await fetch('../p/'+v+'.json',{cache:'no-store'});if(r.ok&&id.value.trim()===v){pl.value='preparada';toast('Hay una demo preparada para «'+v+'»: arrancará con ese menú')}}catch(e){}};id.addEventListener('change',revDemo);nom.addEventListener('change',revDemo);
    nom.oninput=()=>{if(!id.dataset.touch)id.value=nom.value.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30)};id.oninput=()=>id.dataset.touch=1;men.oninput=()=>men.dataset.touch=1;
    gru.onchange=()=>{const g=grupos().find(x=>x.id===gru.value);$('#nCliBox').hidden=!!g;if(!men.dataset.touch)men.value=g?PRECIO.extra:PRECIO.base;$('#nPrecio').firstChild.textContent=g?'Local extra de un cliente: '+money(PRECIO.extra)+' al mes.':'Primer local: '+money(PRECIO.base)+' al mes.';if(g){const p=g.locales[0].plan||{};if(!$('#nCon').value)$('#nCon').value=p.contacto||'';if(!$('#nTel').value)$('#nTel').value=p.telefono||''}};
    if(ed.grupo)gru.onchange();
    fn.onsubmit=async e=>{e.preventDefault();const g=grupos().find(x=>x.id===gru.value),cliente=g?g.nombre:($('#nCli').value.trim()||$('#nCon').value.trim()||nom.value.trim());
      const plan={cliente,contacto:$('#nCon').value.trim(),telefono:$('#nTel').value.trim(),cobro:$('#nCob').value,mensualidad:+men.value||0,pagado_hasta:$('#nHasta').value||'',pagos:[]},nombre=nom.value.trim(),rid=id.value.trim(),pla=$('#nPla').value;
      const gid=g?g.id:'c-'+(slug(cliente)||rid).slice(0,40)+'-'+Math.random().toString(36).slice(2,6);ed.enviando=true;sheet();
      try{const code=await rpc('cm_admin_create',{p_s:K,p_id:rid,p_nombre:nombre,p_plantilla:pla,p_plan:plan});await rpc('cm_admin_set_grupo',{p_s:K,p_id:rid,p_grupo:gid});ed.code=code;ed.r={id:rid,nombre,code,plan,features:{plantilla:pla}};ed.enviando=false;sheet();cargar()}catch(err){ed.enviando=false;sheet();toast(err.message)}}}
}
function leerForm(){if(!ed||ed.tipo!=='editar')return;const v=id=>{const e=$('#'+id);return e?e.value:undefined};
  const m=v('eMen');if(m!==undefined)ed.p.mensualidad=+m||0;const cb=v('eCob');if(cb!==undefined)ed.p.cobro=cb;const gr=v('eGru');if(gr!==undefined)ed.grupo=gr;const cn=v('eCli');if(cn!==undefined)ed.cliNuevo=cn;const hs=v('eHasta');if(hs!==undefined)ed.p.pagado_hasta=hs;const n=v('eNom');if(n!==undefined)ed.nombre=n;
  ['eCon:contacto','eTel:telefono','eNot:notas'].forEach(x=>{const[a,b]=x.split(':');const val=v(a);if(val!==undefined)ed.p[b]=val.trim()})}
const ACC={
  recargar:()=>cargar(),nuevo:()=>{ed={tipo:'nuevo'};sheet()},nuevoEn:d=>{ed={tipo:'nuevo',grupo:d.g};sheet()},cerrar:()=>{ed=null;sheet()},ovClose:(d,e)=>{if(e.target.classList.contains('ov')){ed=null;sheet()}},
  editar:d=>{ed={tipo:'editar',id:d.id};sheet()},
  feat:d=>{leerForm();ed.f[d.k]=ed.f[d.k]===false;sheet()},
  estado:()=>{leerForm();ed.estado=ed.estado==='activo'?'pausado':'activo';sheet()},
  pagoMes:()=>{leerForm();const base=ed.p.pagado_hasta&&ed.p.pagado_hasta>hoyISO()?new Date(ed.p.pagado_hasta+'T12:00'):new Date(hoyISO()+'T12:00');base.setMonth(base.getMonth()+(anual(ed.p)?12:1));
    const h=base.toISOString().slice(0,10);ed.p.pagado_hasta=h;ed.p.pagos=(ed.p.pagos||[]).concat({fecha:hoyISO(),monto:montoPago(ed.p),hasta:h,tipo:anual(ed.p)?'anual':'mensual'});sheet();toast('Pago anotado: pagado hasta '+fFecha(h)+'. Toca «Guardar cambios».')},
  verQR:d=>{ed={tipo:'qr',id:d.id};sheet()},
  copiarLiga:()=>{const r=ed.tipo==='nuevo'?Object.assign({},ed.r,{code:ed.code}):R.find(x=>x.id===ed.id);copiar(msgWA(r),'Mensaje con la liga copiado')},
  codigo:async()=>{if(!ed.confCod){ed.confCod=true;leerForm();sheet();return}try{const c=await rpc('cm_admin_new_code',{p_s:K,p_id:ed.id});const r=R.find(x=>x.id===ed.id);r.code=c;ed.confCod=false;sheet();toast('Código nuevo listo. Manda la liga nueva al restaurante.')}catch(e){toast(e.message)}},
  verResp:async()=>{leerForm();try{ed.respaldos=await rpc('cm_admin_backups',{p_s:K,p_id:ed.id});sheet()}catch(e){toast(e.message)}},
  bajarResp:async d=>{try{const data=await rpc('cm_admin_backup_get',{p_s:K,p_backup:+d.b});const u=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='Respaldo-'+ed.id+'-'+String(data.fecha||'').slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);toast('Respaldo descargado')}catch(e){toast(e.message)}},
  guardar:async()=>{leerForm();const g=grupos().find(x=>x.id===ed.grupo);let gid=ed.grupo;
    if(!g){const n=(ed.cliNuevo||'').trim();if(!n){toast('Escribe el nombre del cliente nuevo');return}ed.p.cliente=n;gid='c-'+(slug(n)||ed.id).slice(0,40)+'-'+Math.random().toString(36).slice(2,6)}else ed.p.cliente=g.nombre;
    ed.guardando=true;sheet();try{await rpc('cm_admin_save',{p_s:K,p_id:ed.id,p_nombre:ed.nombre,p_estado:ed.estado,p_features:ed.f,p_plan:ed.p});const r=R.find(x=>x.id===ed.id);if(gid!==(r.grupo||''))await rpc('cm_admin_set_grupo',{p_s:K,p_id:ed.id,p_grupo:gid});toast('Guardado');ed=null;sheet();cargar()}catch(e){ed.guardando=false;sheet();toast(e.message)}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=ACC[b.dataset.a];if(f){if(b.tagName!=='A'&&b.dataset.a!=='ovClose')e.preventDefault();f(b.dataset,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ed){ed=null;sheet()}});
$('#btnSalir').onclick=()=>{K='';R=[];try{localStorage.removeItem('comandero-dueno')}catch(e){}render()};
cargar();
</script>
</body></html>
