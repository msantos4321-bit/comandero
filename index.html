<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Comandero · Sistema para restaurantes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra negra con logo (identidad del restaurante) + una pantalla por puesto. Botones grandes, táctiles, con fotos. */
/* Carbón de asador: tablero oscuro tipo plancha, el color de la marca como brasa. Pensado para tablet en el restaurante. */
:root{
  --bg:#EEEBE7; --surface:#FFFFFF; --surface2:#F7F5F2; --ink:#1A1715; --muted:#6B635C; --line:#DDD7D0; --chip:#E7E2DC;
  --bar:#151210; --bar-ink:#F4EFE8;
  --brand:#F5B514; --brand-ink:#141414; --brand-deep:#9A6A00;
  --ok:#1F7A4B; --ok-soft:#DCF0E3; --warn:#B26B00; --warn-soft:#FCEACB; --bad:#B8322A; --bad-soft:#F8DEDC; --info:#3E5C8A; --info-soft:#E3E8F0;
  --glow:rgba(0,0,0,.06);
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12100E; --surface:#1C1916; --surface2:#24201C; --ink:#F4EFE8; --muted:#A29890; --line:#332D28; --chip:#2A2521; --bar:#0B0A09; --bar-ink:#F4EFE8; --brand-deep:#F5B514;
  --ok:#4CC383; --ok-soft:#15301F; --warn:#E8A23A; --warn-soft:#382A13; --bad:#F0675D; --bad-soft:#3A1B19; --info:#8FB0E0; --info-soft:#1B2330; --glow:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12100E; --surface:#1C1916; --surface2:#24201C; --ink:#F4EFE8; --muted:#A29890; --line:#332D28; --chip:#2A2521; --bar:#0B0A09; --bar-ink:#F4EFE8; --brand-deep:#F5B514;
  --ok:#4CC383; --ok-soft:#15301F; --warn:#E8A23A; --warn-soft:#382A13; --bad:#F0675D; --bad-soft:#3A1B19; --info:#8FB0E0; --info-soft:#1B2330; --glow:rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.wrap{max-width:1260px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bar)}
header.top .in{max-width:1260px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:8px}
.logo{height:46px;min-width:46px;max-width:92px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--display);font-size:16px;flex:none;overflow:hidden}
.logo img{height:100%;width:auto;display:block}
.brandname{min-width:0;flex:1}
.brandname h1{font-size:20px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandname small{opacity:.7;font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[hidden]{display:none!important}
@media(max-width:640px){header.top .in.dentro .brandname{display:none}header.top .in.dentro .who{margin-left:auto}.logo{height:40px}.brandname small{display:none}}
.who{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.12);font-size:13px;font-weight:700;white-space:nowrap}
.demo{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);font-weight:800}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.btn{min-height:48px;padding:0 18px;border-radius:var(--r);background:var(--chip);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.bar{background:rgba(255,255,255,.12);color:var(--bar-ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)}
.lbl{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
.num{font-variant-numeric:tabular-nums}
.sec{margin-top:18px;display:grid;gap:10px}
.h2{font-size:24px}
/* Tips */
.tip{background:var(--info-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.tip ol{margin:4px 0 0;padding-left:20px}
.tip li{margin:2px 0}
/* Inicio */
.hero{padding-block:16px 4px}
.hero h2{font-size:clamp(28px,5vw,40px)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}
.role{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px;text-align:left;display:grid;gap:6px;min-height:132px}
.role b{font-family:var(--display);font-weight:400;font-size:26px}
.role span{color:var(--muted);font-size:14px}
.role i{font-style:normal;font-size:12.5px;font-weight:700;color:var(--brand-deep);margin-top:auto}
.role:hover{border-color:var(--brand)}
/* Mesas */
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}
.mesa{border-radius:14px;padding:14px;min-height:100px;text-align:left;display:grid;align-content:space-between;gap:6px;background:var(--surface);border:2px solid var(--line)}
.mesa b{font-family:var(--display);font-weight:400;font-size:22px}
.mesa small{font-size:13px;color:var(--muted)}
.mesa.ocup{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 16%,var(--surface))}
.mesa.cuenta{border-color:var(--warn);background:var(--warn-soft)}
.mesa.listo{box-shadow:0 0 0 3px var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.banner{background:var(--ok-soft);border:2px solid var(--ok);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.banner .it{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Orden */
.split{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.split{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}.ticket{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 96px);overflow:auto}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tab{padding:10px 14px;border-radius:99px;background:var(--chip);font-weight:700;white-space:nowrap;min-height:44px}
.tab.on{background:var(--bar);color:var(--brand)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:left;display:flex;flex-direction:column;overflow:hidden;min-height:96px}
.item img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;max-width:100%}
.item .bd{padding:10px 12px;display:grid;gap:4px;flex:1;align-content:space-between}
.item b{font-weight:700;line-height:1.2}
.item .ds{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .p{font-family:var(--display);font-size:19px;color:var(--brand-deep)}
.item:active{transform:scale(.98)}
.item.off{opacity:.45}
.search{position:relative}
.search input{padding-left:40px;font-size:16px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.promos{display:flex;gap:8px;flex-wrap:wrap}
.promo{background:var(--bar);color:var(--brand);border-radius:var(--r);padding:8px 14px;min-height:46px;text-align:left;font-weight:800;line-height:1.2;border:2px solid var(--brand)}
.promo small{display:block;font-weight:600;color:var(--bar-ink);opacity:.85;font-size:12px}
.promo.on{background:var(--brand);color:var(--brand-ink)}
.promo.on small{color:var(--brand-ink)}
.ticket h3{font-size:22px}
.line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .nm{min-width:0}
.line .ops{font-size:12.5px;color:var(--muted)}
.line.x{opacity:.45}
.line.x b{text-decoration:line-through}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:34px;height:34px;border-radius:9px;background:var(--chip);font-weight:800;font-size:18px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px;letter-spacing:.03em;white-space:nowrap;margin-top:3px}
.t-new{background:var(--chip);color:var(--muted)}
.t-cook{background:var(--warn-soft);color:var(--warn)}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-promo{background:color-mix(in srgb,var(--brand) 22%,var(--surface));color:var(--ink)}
.tot{display:grid;gap:4px;margin-top:10px}
.tot div{display:flex;justify-content:space-between;gap:10px}
.tot .big{font-family:var(--display);font-size:26px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--brand-deep)}
input[type=color]{padding:4px;width:64px}
/* Cocina */
.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.kt{background:var(--surface);border-radius:14px;border:2px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.kt .hd{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--chip)}
.kt .hd b{font-family:var(--display);font-weight:400;font-size:22px}
.kt.w{border-color:var(--warn)} .kt.w .hd{background:var(--warn-soft)} .kt.w .hd .tm{color:var(--warn)}
.kt.l{border-color:var(--bad)} .kt.l .hd{background:var(--bad-soft)} .kt.l .hd .tm{color:var(--bad)}
.tm{font-family:var(--display);font-size:22px}
.kt ul{list-style:none;margin:0;padding:6px 14px;flex:1}
.kt li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.kt li:last-child{border-bottom:0}
.kt li b{font-size:17px}
.kt li .ops{font-size:14px;color:var(--muted)}
.kt li .nt{font-size:14px;font-weight:800;color:var(--bad)}
.kt .ft{padding:10px 14px}
.chk{width:34px;height:34px;border-radius:9px;border:2px solid var(--muted);flex:none}
/* Caja */
.olist{display:grid;gap:8px;align-content:start}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center}
.oc.on{border:2px solid var(--brand-deep)}
.oc b{font-family:var(--display);font-weight:400;font-size:19px}
/* Admin */
.atabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--line);margin-bottom:14px}
.atab{padding:12px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.atab.on{color:var(--ink);border-color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi .v{font-family:var(--display);font-size:28px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;margin-top:4px}
.bar .fl{height:100%;background:var(--brand);border-radius:5px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
td input,td select{min-height:38px;padding:6px 8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.day{width:46px;height:40px;border-radius:10px;background:var(--chip);font-weight:700;font-size:13px}
.day.on{background:var(--brand);color:var(--brand-ink)}
.note{font-size:13.5px;color:var(--muted);background:var(--chip);border-radius:10px;padding:10px 12px}
.hg td,.hg th{text-align:center;white-space:nowrap}
.hg td:first-child,.hg th:first-child{text-align:left}
.hg th.hoy{color:var(--brand-deep)}
.cell{width:100%;min-width:92px;min-height:58px;border-radius:10px;padding:6px;display:grid;gap:2px;place-items:center;font-size:12.5px;background:var(--chip);border:2px solid transparent}
.cell b{font-size:12px;font-weight:800}
.s-asistio{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.s-retardo{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.s-falta{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.s-permiso{background:var(--info-soft);border-color:var(--info);color:var(--info)}
.s-descanso{background:repeating-linear-gradient(135deg,var(--chip) 0 6px,var(--surface) 6px 12px);color:var(--muted)}
.cell.auto{border-style:dashed}
.cell input{min-height:30px;padding:2px 4px;font-size:12.5px;width:86px}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(10,10,10,.55);z-index:50;display:grid;place-items:end center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){.ov{place-items:center}}
.md{background:var(--surface);border-radius:18px;width:min(540px,100%);max-height:88vh;overflow:auto;padding:18px;display:grid;gap:14px}
.md h3{font-size:24px}
.md .ph{width:100%;max-height:200px;object-fit:cover;border-radius:12px;max-width:100%}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{padding:9px 14px;border-radius:99px;background:var(--chip);font-weight:700;min-height:44px}
.opt.on{background:var(--brand);color:var(--brand-ink)}
.opt small{font-weight:600;opacity:.8}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:60px;border-radius:12px;background:var(--chip);font-family:var(--display);font-size:26px}
.pins{display:flex;justify-content:center;gap:14px}
.pins i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pins i.f{background:var(--ink);border-color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--bar);color:var(--bar-ink);padding:12px 18px;border-radius:12px;font-weight:700;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.empty{padding:28px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:14px}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;min-height:56px;padding:0 20px;border-radius:99px;background:var(--bar);color:var(--brand);font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px;border:2px solid var(--brand)}
.fab span{font-family:var(--display);font-size:24px;line-height:1}
.faq{display:grid;gap:8px}
.faq details{background:var(--chip);border-radius:10px;padding:10px 12px}
.faq summary{font-weight:700;cursor:pointer}
.faq p{margin:8px 0 0}
.steps{margin:0;padding-left:22px;display:grid;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


.inst{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:2px solid var(--brand);border-radius:16px;padding:12px 14px}
.inst p{margin:2px 0 0;color:var(--muted);font-size:14px}
.inst b{font-size:16px}
.inst-ic{width:44px;height:44px;border-radius:12px;background:var(--bar);color:var(--brand);display:grid;place-items:center;flex:none}
.inst-ic svg{width:26px;height:26px}

/* Nube */
.nube{width:12px;height:12px;border-radius:50%;flex:none;background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 30%,transparent)}
.nube.ok{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 30%,transparent)}
.nube.sin{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 30%,transparent)}
/* Auditoría 2 nov */
.tm{white-space:nowrap}
input[type=checkbox]{accent-color:var(--brand)}
.tip2{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.tip2 summary{cursor:pointer;font-weight:700;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
.tip2 summary::-webkit-details-marker{display:none}
.tip2 summary::before{content:"?";width:20px;height:20px;border-radius:50%;background:var(--chip);color:var(--ink);display:grid;place-items:center;font-size:12px;font-weight:800}
.tip2[open] summary{color:var(--ink);margin-bottom:6px}
.tip2 ol{margin:0;padding-left:22px;display:grid;gap:4px}
.items{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.item{position:relative}
.item.np{min-height:128px;border-top:4px solid var(--brand)}
.item.np .bd{padding:14px}
.item.np b{font-size:16.5px}
.item .enc{position:absolute;top:8px;right:8px;min-width:28px;height:28px;padding:0 8px;border-radius:99px;background:var(--brand);color:var(--brand-ink);font-weight:800;display:grid;place-items:center;box-shadow:0 2px 6px var(--glow)}
.mbar{display:none}
@media(max-width:899px){
  .mbar{display:flex;gap:10px;align-items:center;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--bar);color:var(--bar-ink);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-shadow:0 -6px 20px rgba(0,0,0,.25)}
  .mb-cta{flex:1;display:grid;text-align:left;color:var(--bar-ink);min-width:0}

function migrar(){if(!S.horarios){S.horarios={};S.empleados.forEach(e=>S.horarios[e.id]=defTurno(e));demoAsist()}if(!S.marcas)S.marcas={};S.empleados.forEach(e=>{if(!S.horarios[e.id])S.horarios[e.id]=defTurno(e)});if(S.tolerancia==null)S.tolerancia=10;S.empleados.forEach(e=>{if(e.puesto==='Dueña')e.puesto='Gerente'});(S.movs||[]).forEach(m=>{if(m.quien==='Dueña')m.quien='Gerente'})}
const TOL=()=>S.tolerancia??10;
function semana(off){const d=new Date();d.setHours(0,0,0,0);const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow+off*7);return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x})}
const minDe=s=>{const [h,m]=(s||'0:0').split(':');return +h*60+(+m)};
function demoAsist(){const hoyK=dkey(new Date());let n=0;
  const ahora=new Date(),minAhora=ahora.getHours()*60+ahora.getMinutes();
  semana(0).forEach(d=>{if(dkey(d)>hoyK)return;const esHoy=dkey(d)===hoyK;S.empleados.forEach(e=>{const t=S.horarios[e.id][d.getDay()];if(!t)return;
    if(esHoy){if(minDe(t.ent)>minAhora)return;const en=new Date(d);en.setHours(0,minDe(t.ent)-4,0,0);S.asist.push({emp:e.id,tipo:'entrada',t:en.getTime()});return}
    n++;if(n%7===3)return;
    const tarde=n%5===2?18:n%3;const en=new Date(d);en.setHours(0,minDe(t.ent)+tarde-3,0,0);const sa=new Date(d);sa.setHours(0,minDe(t.sal)+5,0,0);
    S.asist.push({emp:e.id,tipo:'entrada',t:en.getTime()},{emp:e.id,tipo:'salida',t:sa.getTime()})})})}
function checadas(emp,d){const k=dkey(d);return S.asist.filter(a=>a.emp===emp&&dkey(new Date(a.t))===k)}
function estadoDia(emp,d){
  const t=(S.horarios[emp]||[])[d.getDay()],man=S.marcas[dkey(d)+'|'+emp];
  if(man)return {st:man,auto:false,t};
  if(!t)return {st:'descanso',auto:false,t};
  const e=checadas(emp,d).find(a=>a.tipo==='entrada');
  if(e){const dt=new Date(e.t),m=dt.getHours()*60+dt.getMinutes();return {st:m>minDe(t.ent)+TOL()?'retardo':'asistio',auto:true,t,hora:hora(e.t)}}
  const ahora=new Date(),hoyK=dkey(ahora),k=dkey(d);
  if(k<hoyK||(k===hoyK&&ahora.getHours()*60+ahora.getMinutes()>minDe(t.ent)+60))return {st:'falta',auto:true,t};
  return {st:'pend',auto:false,t};
}
function horasSemana(emp,dias){let ms=0;dias.forEach(d=>{const c=checadas(emp,d).sort((a,b)=>a.t-b.t);let ini=null;c.forEach(a=>{if(a.tipo==='entrada')ini=a.t;else if(ini){ms+=a.t-ini;ini=null}})});return Math.round(ms/36e5*10)/10}

function inkFor(hex){const h=(hex||'#000').replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return (0.299*r+0.587*g+0.114*b)/255>0.55?'#141414':'#FFFFFF'}
let audioCtx=null;function beep(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();[0,.18].forEach(d=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.18,audioCtx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d+.15);o.start(audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d+.16)})}catch(e){}}

const nube={rev:0,hash:{},dirty:new Set(),pushT:null,enviando:false,estado:'conectando',ws:null,pend:false,cargando:false,features:{},err:''};
function vacio(){return {config:{nombre:'Mi restaurante',lema:'',color:'#E8622C',iniciales:'MR',logo:'',fondo:500,envio:40,salsas:'',telefono:''},
  canales:[{id:'mesa',nombre:'En mesa',ajuste:0,activo:true,fijo:true},{id:'llevar',nombre:'Para llevar',ajuste:0,activo:true},{id:'domicilio',nombre:'Domicilio',ajuste:0,activo:true},{id:'uber',nombre:'Uber Eats',ajuste:30,activo:true},{id:'didi',nombre:'DiDi Food',ajuste:30,activo:true}],

  empleados:[{id:uid(),nombre:'Gerente',puesto:'Gerente',pin:'1234'}],ordenes:[],movs:[],asist:[],cortes:[],marcas:{},horarios:{},tolerancia:10,seq:100}}

const hashOf=v=>{const t=JSON.stringify(v===undefined?null:v);let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return t.length+':'+h};
function rpc(fn,args){return fetch(NUBE.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:NUBE.key,'Content-Type':'application/json'},body:JSON.stringify(args),cache:'no-store'})
  .then(async r=>{const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&(j.message||j.hint))||('Error '+r.status));return j})}
function nubeMarcar(){
  DOCS.forEach(k=>{const h=hashOf(docVal(k));if(nube.hash['d:'+k]!==h)nube.dirty.add('d:'+k)});
  S.ordenes.forEach(o=>{const h=hashOf(o);if(nube.hash['o:'+o.id]!==h)nube.dirty.add('o:'+o.id)});
  const vivas=new Set(S.ordenes.map(o=>'o:'+o.id));Object.keys(nube.hash).forEach(k=>{if(k.startsWith('o:')&&nube.hash[k]!=='x'&&!vivas.has(k))nube.dirty.add(k)});
  clearTimeout(nube.pushT);nube.pushT=setTimeout(nubeEnviar,250)}
async function nubeEnviar(){
  if(!CN||nube.cargando||nube.enviando||!nube.dirty.size)return;
  nube.enviando=true;const keys=[...nube.dirty].slice(0,200),items=[],snap={};
  keys.forEach(k=>{if(k.startsWith('d:')){const key=k.slice(2),v=docVal(key);snap[k]=hashOf(v);items.push({kind:'doc',key,data:v===undefined?null:v})}
    else{const id=k.slice(2),o=S.ordenes.find(x=>x.id===id);if(o){snap[k]=hashOf(o);items.push({kind:'orden',key:id,data:o})}else{snap[k]='x';items.push({kind:'orden',key:id,data:null,deleted:true})}}});
  try{await rpc('cm_put',{p_r:CN.r,p_k:CN.k,p_items:items});
    keys.forEach(k=>{nube.hash[k]=snap[k];const cur=k.startsWith('d:')?hashOf(docVal(k.slice(2))):(()=>{const o=S.ordenes.find(x=>x.id===k.slice(2));return o?hashOf(o):'x'})();if(cur===snap[k])nube.dirty.delete(k)});
    nubeEstado('ok');wsAvisar()}
  catch(e){nubeEstado('sin',e.message)}
  nube.enviando=false;
  if(nube.dirty.size)setTimeout(nubeEnviar,nube.estado==='ok'?50:5000);else nubeTraer()}
function mezclarItem(a,b){const base=(a.u||0)>(b.u||0)?a:b;return Object.assign({},base,{enviado:!!(a.enviado||b.enviado),servido:!!(a.servido||b.servido),cancel:!!(a.cancel||b.cancel),borrado:!!(a.borrado||b.borrado),estado:(a.estado==='listo'||b.estado==='listo')?'listo':(b.estado||a.estado),t:b.t||a.t,listoT:b.listoT||a.listoT})}
function mezclarOrden(rem,loc){const r=Object.assign({},rem,loc);if((rem.estado||'abierta')!=='abierta'&&(loc.estado||'abierta')==='abierta'){r.estado=rem.estado;r.pago=rem.pago;r.pagadaT=rem.pagadaT}
  const its=[];(loc.items||[]).forEach(i=>{const x=(rem.items||[]).find(y=>y.id===i.id);its.push(x?mezclarItem(x,i):i)});(rem.items||[]).forEach(x=>{if(!(loc.items||[]).some(i=>i.id===x.id))its.push(x)});r.items=its;return r}
let traerEnCurso=false;
async function nubeTraer(){
  if(!CN||traerEnCurso)return;traerEnCurso=true;let cambio=false;
  try{const r=await rpc('cm_get',{p_r:CN.r,p_k:CN.k,p_since:nube.rev});nube.features=r.features||{};
    if(nube.cargando){
      if(!r.items.length){ // restaurante nuevo: se llena con sus datos iniciales o en blanco
        let ini=null;try{const f=await fetch('r/'+CN.r+'.json',{cache:'no-store'});if(f.ok)ini=await f.json()}catch(e){}
        S=ini||vacio();if(S.fotos){FOTOS=S.fotos;delete S.fotos}S.ordenes=S.ordenes||[];migrar();nube.cargando=false;nube.hash={};save();traerEnCurso=false;render();return}
      S.ordenes=[];}
    r.items.forEach(it=>{
      if(it.kind==='doc'){const k='d:'+it.key;if(nube.dirty.has(k))return;if(it.key==='fotos'){FOTOS=it.data||{};try{localStorage.setItem(KEY+'-fotos',JSON.stringify(FOTOS))}catch(e){}}else S[it.key]=it.data;nube.hash[k]=hashOf(it.data);cambio=true}
      else if(it.kind==='orden'){const k='o:'+it.key,ix=S.ordenes.findIndex(o=>o.id===it.key);
        if(it.deleted){if(ix>=0&&!nube.dirty.has(k))S.ordenes.splice(ix,1);nube.hash[k]='x';cambio=true;return}
        if(ix<0){S.ordenes.push(it.data);nube.hash[k]=hashOf(it.data);cambio=true;return}
        if(nube.dirty.has(k)){S.ordenes[ix]=mezclarOrden(it.data,S.ordenes[ix])}else{S.ordenes[ix]=it.data;nube.hash[k]=hashOf(it.data)}cambio=true}});
    if(nube.cargando){nube.cargando=false;cambio=true}
    nube.rev=Math.max(nube.rev,r.rev||0);try{localStorage.setItem(KEY+'-rev',String(nube.rev))}catch(e){}
    if(cambio){migrar();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}S.ordenes.forEach(o=>{if(!nube.hash['o:'+o.id])nube.hash['o:'+o.id]=hashOf(o)});DOCS.forEach(k=>{if(!nube.hash['d:'+k])nube.hash['d:'+k]=hashOf(docVal(k))});nubeRender()}
    nubeEstado('ok')}
  catch(e){nubeEstado('sin',e.message);if(/incorrecto|pausado/i.test(e.message)&&nube.cargando){nube.cargando=false;render()}}
  traerEnCurso=false}

/* Aviso instantáneo entre aparatos (canal de la nube); si falla, igual se revisa cada pocos segundos */
let wsRef=1,wsHb=null,wsVivo=false;
function wsConectar(){if(!CN||!('WebSocket' in window))return;try{
  const ws=new WebSocket(NUBE.url.replace('https','wss')+'/realtime/v1/websocket?apikey='+NUBE.key+'&vsn=1.0.0');nube.ws=ws;const topic='realtime:cm-'+CN.r+'-'+CN.k.replace(/[^A-Z0-9]/g,'').slice(-6);
  ws.onopen=()=>{ws.send(JSON.stringify({topic,event:'phx_join',payload:{config:{broadcast:{self:false,ack:false},presence:{key:''},private:false}},ref:String(wsRef++)}));
    clearInterval(wsHb);wsHb=setInterval(()=>{try{ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:String(wsRef++)}))}catch(e){}},25000)};
  ws.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event==='phx_reply'&&m.payload&&m.payload.status==='ok')wsVivo=true;if(m.event==='broadcast')nubeTraer()}catch(e){}};
  ws.onclose=()=>{wsVivo=false;clearInterval(wsHb);setTimeout(wsConectar,5000)};ws.onerror=()=>{try{ws.close()}catch(e){}};
  nube.topic=topic}catch(e){}}
function wsAvisar(){const ws=nube.ws;if(ws&&ws.readyState===1)try{ws.send(JSON.stringify({topic:nube.topic,event:'broadcast',payload:{type:'broadcast',event:'cambio',payload:{}},ref:String(wsRef++)}))}catch(e){}}
function nubeIniciar(){if(!CN)return;wsConectar();nubeTraer();
  setInterval(()=>{if(document.visibilityState==='visible')nubeTraer()},wsVivo?15000:4000);
  setInterval(()=>{if(nube.pend&&!ui.modal&&!escribiendo()){nube.pend=false;render()}},1000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')nubeTraer()});
  window.addEventListener('online',()=>{nubeEnviar();nubeTraer()})}

  <div class="card"><p class="lbl">Cancelaciones y promociones usadas</p>${movs.length?`<div class="tbl"><table><tr><th>Hora</th><th>Qué</th><th>Quién</th><th>Motivo</th></tr>${movs.slice().reverse().map(m=>`<tr><td class="num">${hora(m.t)}</td><td>${esc(m.tipo)}: ${esc(m.det)} <span class="num">(${money(m.monto)})</span></td><td>${esc(m.quien)}</td><td>${esc(m.motivo)}</td></tr>`).join('')}</table></div>`:'<p class="muted">Ninguna hoy.</p>'}<p class="muted" style="font-size:13px;margin-bottom:0">Cada cancelación pide PIN del gerente o encargada y queda aquí.</p></div></div>
  <div class="grid2" style="margin-top:12px"><div class="card"><p class="lbl">Personal de hoy</p>${asistHoy()}</div><div class="card"><p class="lbl">Cortes de caja de hoy</p>${S.cortes.filter(c=>hoy(c.t)).map(c=>`<p class="num">${hora(c.t)} · ${esc(c.quien)} · debía haber ${money(c.esperado)} · contó ${money(c.contado)} · <b style="color:${c.dif===0?'var(--ok)':'var(--bad)'}">${c.dif===0?'cuadra':(c.dif>0?'sobra ':'falta ')+money(Math.abs(c.dif))}</b></p>`).join('')||'<p class="muted">Aún no hay cortes hoy.</p>'}</div></div>`;
}
function asistHoy(){const d=new Date();const rows=S.empleados.map(e=>{const s=estadoDia(e.id,d),c=checadas(e.id,d),ent=c.find(a=>a.tipo==='entrada'),sal=c.filter(a=>a.tipo==='salida').pop();if(s.st==='descanso'&&!ent)return '';
  return `<tr><td>${esc(e.nombre)}</td><td class="num">${s.t?s.t.ent+'–'+s.t.sal:'—'}</td><td><span class="tag ${s.st==='asistio'?'t-ok':s.st==='retardo'?'t-cook':s.st==='falta'?'t-bad':'t-new'}" style="margin:0">${ST_TXT[s.st]}</span></td><td class="num">${ent?hora(ent.t):'—'}</td><td class="num">${sal?hora(sal.t):'—'}</td></tr>`}).join('');
  const desc=S.empleados.filter(e=>estadoDia(e.id,d).st==='descanso').map(e=>esc(e.nombre));
  return `<div class="tbl"><table><tr><th>Quién trabaja hoy</th><th>Turno</th><th>Estado</th><th>Entró</th><th>Salió</th></tr>${rows}</table></div>${desc.length?`<p class="muted" style="font-size:13px;margin:8px 0 0">Descansan hoy: ${desc.join(', ')}</p>`:''}`}
function aHorarios(){
  const dias=semana(ui.sem),hoyK=dkey(new Date()),f=d=>d.toLocaleDateString('es-MX',{day:'numeric',month:'short'});
  const emps=S.empleados.filter(e=>(S.horarios[e.id]||[]).some(Boolean)||ui.hEdit);
  let h=`<div class="row"><button class="btn sm ghost" data-a="sem" data-d="-1" aria-label="Semana anterior">←</button><b class="num">${f(dias[0])} – ${f(dias[6])}</b><button class="btn sm ghost" data-a="sem" data-d="1" aria-label="Semana siguiente">→</button>${ui.sem?'<button class="btn sm ghost" data-a="sem" data-d="0">Esta semana</button>':''}<span class="sp"></span><button class="btn sm" data-a="copiarH">Copiar para WhatsApp</button><button class="btn sm ${ui.hEdit?'pri':''}" data-a="hEdit">${ui.hEdit?'Listo':'Editar horarios'}</button></div>`;
  h+=ui.hEdit?`<div class="note" style="margin-top:10px">Pon la hora de entrada y salida de cada día. El horario se repite cada semana. Toca <b>Descansa</b> para marcar su día libre.</div>`
    :`<div class="note" style="margin-top:10px">Toca un día para marcarlo: <b style="color:var(--ok)">Asistió</b> → <b style="color:var(--warn)">Retardo</b> → <b style="color:var(--bad)">Faltó</b> → <b style="color:var(--info)">Permiso</b> → quitar marca. Lo que tiene borde punteado lo marcó la app sola con la checada de PIN (retardo después de ${TOL()} min).</div>`;
  h+=`<div class="tbl card hg" style="margin-top:10px;padding:6px"><table><tr><th>Persona</th>${dias.map(d=>`<th class="${dkey(d)===hoyK?'hoy':''}">${DIAS[d.getDay()]} ${d.getDate()}</th>`).join('')}${ui.hEdit?'':'<th>Semana</th>'}</tr>`;
  emps.forEach(e=>{h+=`<tr><td><b>${esc(e.nombre)}</b><br><small class="muted">${esc(e.puesto)}</small></td>`;
    dias.forEach(d=>{const dow=d.getDay(),t=S.horarios[e.id][dow];
      if(ui.hEdit){h+=`<td><div class="cell ${t?'':'s-descanso'}">${t?`<input type="time" id="h-${e.id}-${dow}-e" data-h="${e.id}:${dow}:ent" value="${t.ent}" aria-label="Entrada"><input type="time" id="h-${e.id}-${dow}-s" data-h="${e.id}:${dow}:sal" value="${t.sal}" aria-label="Salida">`:''}<button class="btn sm ghost" style="min-height:28px;padding:0 8px" data-a="hDesc" data-e="${e.id}" data-d="${dow}">${t?'Descansa':'Trabaja'}</button></div></td>`;return}
      const s=estadoDia(e.id,d),fut=dkey(d)>hoyK,bloq=fut||(s.st==='descanso'&&!S.marcas[dkey(d)+'|'+e.id]);
      h+=`<td><button class="cell s-${s.st} ${s.auto?'auto':''}" data-a="marca" data-e="${e.id}" data-k="${dkey(d)}" ${bloq?'disabled style="cursor:default"':''}><b>${ST_TXT[s.st]}</b><span class="num">${s.t?s.t.ent+'–'+s.t.sal:''}</span>${s.hora?`<small class="num">llegó ${s.hora}</small>`:''}</button></td>`});
    if(!ui.hEdit){let a=0,r=0,x=0;dias.forEach(d=>{const s=estadoDia(e.id,d).st;if(s==='asistio')a++;if(s==='retardo')r++;if(s==='falta')x++});
      h+=`<td style="text-align:left;font-size:13px"><span style="color:var(--ok)">${a} asist.</span><br><span style="color:var(--warn)">${r} retardos</span><br><span style="color:var(--bad)">${x} faltas</span><br><span class="num muted">${horasSemana(e.id,dias)} h</span></td>`}
    h+=`</tr>`});
  h+=`</table></div>`;
  if(!ui.hEdit)h+=`<div class="row" style="margin-top:10px"><label class="row" style="gap:8px"><span class="lbl">Minutos de tolerancia antes de contar retardo</span><input type="number" id="tol" data-tol="1" value="${TOL()}" style="width:80px"></label></div>`;
  return h;
}
function aMenu(){

  return h+`</table></div>`;

    const extra=gs.reduce((a,g,gi)=>a+((g.v.find(v=>v.t===m.sel[gi])||{}).x||0),0)+(+m.cambioP||0);

    gs.forEach((g,gi)=>b+=`<div><p class="lbl" style="margin:0 0 6px">${esc(g.n)} ${m.sel[gi]?'':'<span style="color:var(--bad)">· elige una</span>'}</p><div class="opts">${g.v.map(v=>`<button class="opt ${m.sel[gi]===v.t?'on':''}" data-a="optSel" data-g="${gi}" data-v="${esc(v.t)}">${esc(v.t)}${v.x?` <small>+${money(v.x)}</small>`:''}</button>`).join('')}</div></div>`);
    b+=`<label><span class="lbl">Nota para cocina (sin costo)</span><input id="nota" placeholder="Sin cebolla, salsa aparte…" value="${esc(m.nota||'')}"></label>
    <div class="row" style="align-items:end"><label style="flex:2;min-width:160px"><span class="lbl">Cambio con costo</span><input id="cambioT" placeholder="Ej. extra tocino" value="${esc(m.cambioT||'')}"></label><label style="flex:1;min-width:90px"><span class="lbl">Costo extra</span><input id="cambioP" type="number" inputmode="decimal" placeholder="0" value="${esc(m.cambioP||'')}"></label></div>
    <div class="row"><div class="qty"><button data-a="mq" data-d="-1" aria-label="Menos">−</button><span class="num" style="min-width:26px;text-align:center;font-weight:800;font-size:18px">${m.qty}</span><button data-a="mq" data-d="1" aria-label="Más">+</button></div><span class="sp"></span><button class="btn ghost" data-a="cerrar">Cancelar</button><button class="btn pri" data-a="addOk">Agregar ${money(precioCanal(it.precio+extra,o.canal)*m.qty)}</button></div>`}
  if(m.tipo==='cobro'){const o=S.ordenes.find(x=>x.id===m.oid),t=tot(o).total,p=m.prop,T=t+p,dv=m.div||1;
    b=`<h3>Cobrar ${esc(oNombre(o))}</h3><div class="tot num"><div><span>Consumo</span><span>${money(t)}</span></div><div><span>Propina</span><span>${money(p)}</span></div><div class="big"><span>Total a cobrar</span><span>${money(T)}</span></div>${dv>1?`<div style="font-weight:800"><span>Cada uno (${dv} personas)</span><span>${money(Math.ceil(T/dv))}</span></div>`:''}</div>

    <div><p class="lbl" style="margin:0 0 6px">Dividir entre</p><div class="opts">${[1,2,3,4,5,6].map(x=>`<button class="opt ${dv===x?'on':''}" data-a="div" data-n="${x}">${x===1?'No dividir':x}</button>`).join('')}</div></div>
    <div><p class="lbl" style="margin:0 0 6px">Forma de pago</p><div class="opts">${[...(['uber','didi'].includes(S.ordenes.find(x=>x.id===m.oid)?.canal)?[['app','Pagado en la app']]:[]),['efectivo','Efectivo'],['tarjeta','Tarjeta'],['mixto','Efectivo + tarjeta']].map(([k,v])=>`<button class="opt ${m.met===k?'on':''}" data-a="met" data-m="${k}">${v}</button>`).join('')}</div></div>`;
    if(m.met==='efectivo')b+=`<label><span class="lbl">¿Con cuánto paga?</span><input id="recib" type="number" inputmode="decimal" value="${m.recib||''}" placeholder="${T}"></label><div class="opts">${[...new Set([T,Math.ceil(T/50)*50,Math.ceil(T/100)*100,Math.ceil(T/500)*500,1000].filter(v=>v>=T))].sort((a,b)=>a-b).slice(0,5).map(v=>`<button class="opt ${+m.recib===v?'on':''}" data-a="billete" data-v="${v}">${v===T?'Exacto':money(v)}</button>`).join('')}</div><p class="num" style="margin:0;font-size:20px">Cambio: <b>${money(Math.max(0,(+m.recib||T)-T))}</b></p>`;
    if(m.met==='app')b+=`<p class="note" style="margin:0">El cliente ya pagó en la plataforma. Se registra como venta por app, sin entrar a la caja.</p>`;
    if(m.met==='tarjeta')b+=`<p class="note" style="margin:0">Cobra <b>${money(T)}</b> en la terminal y toca "Confirmar pago" cuando salga aprobado.</p>`;
    if(m.met==='mixto')b+=`<label><span class="lbl">Parte en efectivo</span><input id="mixef" type="number" inputmode="decimal" value="${m.mixef||''}"></label><p class="num" style="margin:0">Cobrar en terminal: <b>${money(Math.max(0,T-(+m.mixef||0)))}</b></p>`;
    b+=`<div class="row"><button class="btn ghost" data-a="cerrar">Cancelar</button><span class="sp"></span><button class="btn ok" data-a="pagar">Confirmar pago</button></div>`}
  if(m.tipo==='corte'){const desde=Math.max(0,...S.cortes.map(c=>c.t)),pag=S.ordenes.filter(o=>o.estado==='pagada'&&o.pagadaT>desde);const ef=pag.reduce((a,o)=>a+o.pago.efectivo,0),tj=pag.reduce((a,o)=>a+o.pago.tarjeta,0),esp=S.config.fondo+ef;
    b=`<h3>Corte de caja</h3>`;
    if(!m.listo)b+=`<p class="muted" style="margin:0">Cuenta todo el efectivo del cajón y escribe el total. Después la app te dice si cuadra.</p><input id="contado" type="number" inputmode="decimal" placeholder="Efectivo contado" value="${m.contado??''}"><div class="row"><button class="btn ghost" data-a="cerrar">Cancelar</button><span class="sp"></span><button class="btn pri" data-a="corteVer">Ver resultado</button></div>`;
    else{const dif=Math.round((m.contado-esp)*100)/100;b+=`<div class="tot num"><div><span>Fondo inicial</span><span>${money(S.config.fondo)}</span></div><div><span>Ventas en efectivo</span><span>${money(ef)}</span></div><div><span>Debe haber</span><span>${money(esp)}</span></div><div><span>Contaste</span><span>${money(m.contado)}</span></div><div class="big" style="color:${dif===0?'var(--ok)':'var(--bad)'}"><span>${dif===0?'Cuadra':dif>0?'Sobra':'Falta'}</span><span>${money(Math.abs(dif))}</span></div><div><span>Tarjeta</span><span>${money(tj)}</span></div><div><span>Cuentas cobradas</span><span>${pag.length}</span></div></div><button class="btn pri" data-a="corteOk">Guardar corte</button>`}}
  if(m.tipo==='texto')b=`<h3>${esc(m.titulo||'Copia este texto')}</h3><p class="muted" style="margin:0">Mantén presionado el texto, elige "Seleccionar todo" y "Copiar".</p><textarea id="txtcopy" rows="12" readonly>${esc(m.txt)}</textarea><button class="btn" data-a="cerrar">Cerrar</button>`;
  if(m.tipo==='mih'){const e=S.empleados.find(x=>x.id===m.emp),dias=semana(0);b=`<h3>Horario de ${esc(e.nombre)}</h3><div class="tbl"><table><tr><th>Día</th><th>Turno</th><th>Estado</th></tr>${dias.map(d=>{const s=estadoDia(e.id,d);return `<tr><td>${DIAS[d.getDay()]} ${d.getDate()}</td><td class="num">${s.t?s.t.ent+' a '+s.t.sal:'<b>Descansa</b>'}</td><td>${s.st==='descanso'||s.st==='pend'?'':ST_TXT[s.st]}</td></tr>`}).join('')}</table></div><p class="num" style="margin:0">Horas trabajadas esta semana: <b>${horasSemana(e.id,dias)} h</b></p><button class="btn" data-a="cerrar">Cerrar</button>`}
  if(m.tipo==='ayuda'){const v=vista(),pasos=AYUDA_PASOS[v]||AYUDA_PASOS.inicio,q=norm(m.q);const lista=faqBuscar(m.q);
    b=`<div class="row"><h3>¿Necesitas ayuda?</h3><span class="sp"></span><button class="btn sm ghost" data-a="cerrar">Cerrar</button></div>
    <div class="card" style="display:grid;gap:8px"><p class="lbl" style="margin:0">En esta pantalla</p><ol class="steps">${pasos.map(p=>`<li>${esc(p)}</li>`).join('')}</ol><button class="btn pri" data-a="hablar" data-t="${esc(pasos.join('. '))}">Escuchar en voz alta</button></div>
    <div class="search">${LUPA}<input id="aq" type="search" placeholder="Escribe tu duda: cancelar, cobrar, horario…" value="${esc(m.q||'')}" aria-label="Buscar ayuda"></div>
    <div class="faq" id="faq">${faqHtml(lista)}</div>`}
  el.innerHTML=`<div class="ov" data-a="ovClose"><div class="md" role="dialog" aria-modal="true">${b}</div></div>`;
}
function faqBuscar(q){const ws=norm(q).split(/\s+/).filter(Boolean);return FAQ.filter(([p,r])=>ws.every(w=>norm(p+' '+r).includes(w)))}
function faqHtml(lista){return lista.length?lista.map(([p,r],i)=>`<details ${lista.length===1?'open':''}><summary>${esc(p)}</summary><p>${esc(r)}</p><button class="btn sm" style="margin-top:8px" data-a="hablar" data-t="${esc(p+'. '+r)}">Escuchar</button></details>`).join(''):'<p class="muted">No encontré esa duda. Pregúntale a la encargada o al gerente.</p>'}

  billete:d=>{ui.modal.recib=String(d.v);renderModal()},
  imprimir:d=>{const o=S.ordenes.find(x=>x.id===d.o),t=tot(o),c=S.config;let el=document.getElementById('printArea');if(!el){el=document.createElement('div');el.id='printArea';document.body.appendChild(el)}
    el.innerHTML=`<div class="pt-h"><b>${esc(c.nombre)}</b><br>${esc(c.lema)}<br>Tel. ${esc(c.telefono)}</div><div>Cuenta #${o.num} · ${esc(oNombre(o))}<br>${new Date().toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'})}</div><hr>${o.items.filter(i=>!i.cancel).map(i=>`<div class="pt-l"><span>${i.qty} ${esc(i.nombre)}${i.ops?`<br><small>${esc(i.ops)}</small>`:''}</span><span>${money(i.precio*i.qty)}</span></div>`).join('')}<hr>${t.desc?`<div class="pt-l"><span>Promociones</span><span>-${money(t.desc)}</span></div>`:''}<div class="pt-l pt-t"><span>TOTAL</span><span>${money(t.total)}</span></div><hr><div class="pt-h">¡Gracias por su visita!</div>`;
    try{window.print()}catch(e){toast('Este aparato no permite imprimir')}},
  copiarTicket:d=>{const o=S.ordenes.find(x=>x.id===d.o),t=tot(o);let s=`${S.config.nombre}\nCuenta #${o.num} · ${oNombre(o)}\n\n`;o.items.filter(i=>!i.cancel).forEach(i=>s+=`${i.qty}x ${i.nombre}${i.ops?' ('+i.ops+')':''}  ${money(i.precio*i.qty)}\n`);if(t.desc)s+=`Promociones: -${money(t.desc)}\n`;s+=`\nTOTAL: ${money(t.total)}\n\nGracias por tu preferencia · ${S.config.telefono}`;copiar(s,'Ticket copiado. Pégalo en WhatsApp','Ticket')},
  corte:()=>{ui.modal={tipo:'corte'};renderModal()},
  corteVer:()=>{const v=(document.getElementById('contado')||{}).value;if(v===''||v==null){toast('Escribe el efectivo que contaste');return}ui.modal.contado=+v;ui.modal.listo=true;renderModal()},
  corteOk:()=>{const desde=Math.max(0,...S.cortes.map(c=>c.t)),pag=S.ordenes.filter(o=>o.estado==='pagada'&&o.pagadaT>desde),ef=pag.reduce((a,o)=>a+o.pago.efectivo,0),esp=S.config.fondo+ef;
    S.cortes.push({t:Date.now(),quien:ui.user.nombre,esperado:esp,contado:ui.modal.contado,dif:Math.round((ui.modal.contado-esp)*100)/100});ui.modal=null;save();toast('Corte guardado. El gerente lo ve en su resumen');render()},
  adm:d=>{ui.adm=d.t;ui.confirmReset=false;render()},
  addItem:()=>{S.menu.unshift({id:uid(),nombre:'Nuevo platillo',cat:S.categorias[0],precio:0,desc:'',opciones:'',foto:'',activo:true});ui.mq='';save();render()},
  delItem:d=>{S.menu=S.menu.filter(x=>x.id!==d.m);save();render()},
  addCat:()=>{const v=(document.getElementById('newcat').value||'').trim();if(v&&!S.categorias.includes(v)){S.categorias.push(v);save();toast('Categoría agregada');render()}},
  npTipo:d=>{ui.np.tipo=d.t;ui.np.item='';render()},
  npDia:d=>{const n=+d.d,ds=ui.np.dias;ui.np.dias=ds.includes(n)?ds.filter(x=>x!==n):[...ds,n].sort();render()},
  savePromo:()=>{const np=ui.np;if(!np.nombre.trim()){toast('Ponle nombre a la promoción');return}if(np.tipo!=='pct'&&!np.item){toast(np.tipo==='precio'?'Escribe qué incluye el paquete':'Elige qué se regala');return}
    S.promos.unshift({id:uid(),nombre:np.nombre.trim(),tipo:np.tipo,valor:+np.valor||0,cat:np.tipo==='pct'?np.cat:'',item:np.item,dias:np.dias,activa:true});ui.np=null;save();toast('Promoción creada');render()},
  delPromo:d=>{S.promos=S.promos.filter(x=>x.id!==d.p);save();render()},
  addMesa:()=>{S.mesas.push({id:uid(),nombre:'Mesa '+(S.mesas.length+1)});save();render()},
  delMesa:d=>{S.mesas=S.mesas.filter(x=>x.id!==d.m);save();render()},
  addEmp:()=>{const e={id:uid(),nombre:'Nueva persona',puesto:'Mesero',pin:String(Math.floor(1000+Math.random()*9000))};S.empleados.push(e);S.horarios[e.id]=defTurno(e);save();render()},
  delEmp:d=>{S.empleados=S.empleados.filter(x=>x.id!==d.e);delete S.horarios[d.e];save();render()},
  sem:d=>{ui.sem=+d.d===0?0:ui.sem+(+d.d);render()},
  hEdit:()=>{ui.hEdit=!ui.hEdit;render()},
  hDesc:d=>{const h=S.horarios[d.e];h[+d.d]=h[+d.d]?null:{ent:'13:00',sal:'22:00'};save();render()},
  marca:d=>{const k=d.k+'|'+d.e,ord=['asistio','retardo','falta','permiso'];const cur=S.marcas[k]||estadoDia(d.e,new Date(d.k+'T12:00')).st;const i=ord.indexOf(cur);
    if(S.marcas[k]&&i===ord.length-1)delete S.marcas[k];else S.marcas[k]=ord[(i+1)%ord.length];save();render()},
  copiarH:()=>{const dias=semana(ui.sem);let t=`Horarios ${S.config.nombre} · semana del ${dias[0].toLocaleDateString('es-MX',{day:'numeric',month:'long'})}\n`;
    S.empleados.forEach(e=>{const h=S.horarios[e.id];if(!h.some(Boolean))return;t+=`\n${e.nombre}:\n`+dias.map(d=>{const x=h[d.getDay()];return `  ${DIAS[d.getDay()]} ${d.getDate()}: ${x?x.ent+' a '+x.sal:'DESCANSA'}`}).join('\n')});
    copiar(t,'Horario copiado. Pégalo en WhatsApp','Horario de la semana')},
  quitarFoto:d=>{const m=S.menu.find(x=>x.id===d.m);m.foto='';save();render()},
  reset:()=>{if(CN){toast('En un restaurante conectado no se reinician los datos');return}if(ui.confirmReset){S=seed();migrar();save();ui.confirmReset=false;toast('Datos de ejemplo restaurados');ui.adm='resumen';render()}else{ui.confirmReset=true;render()}}
};
function copiar(t,ok,titulo){const fb=()=>{ui.modal={tipo:'texto',txt:t,titulo};renderModal()};try{navigator.clipboard.writeText(t).then(()=>toast(ok),fb)}catch(_){fb()}}
function nuevaOrden(c,mesa){const o={id:uid(),num:++S.seq,canal:c,mesa,cliente:'',items:[],promos:[],estado:'abierta',creada:Date.now(),cuenta:false,pago:null};S.ordenes.push(o);save();if(CN)rpc('cm_next_num',{p_r:CN.r,p_k:CN.k}).then(n=>{o.num=n;S.seq=Math.max(S.seq,n);save();nubeRender()}).catch(()=>{});return o}
function linea(it,ops,nota,qty,promo){return {id:uid(),mid:it.id||'',nombre:it.nombre,cat:it.cat,precio:it.precio,qty,ops:ops||'',nota:nota||'',enviado:false,t:null,estado:'nuevo',servido:false,cancel:false,promo:promo||''}}
function addLinea(it,ops,nota,qty,extra){const o=S.ordenes.find(x=>x.id===ui.orden);const l=linea(it,ops,nota,qty);l.precio=precioCanal(it.precio+(extra||0),o.canal);
  const same=o.items.find(i=>!i.enviado&&!i.cancel&&i.mid===it.id&&i.ops===l.ops&&i.nota===l.nota&&i.precio===l.precio);if(same){same.qty+=qty;same.u=Date.now()}else{l.u=Date.now();o.items.push(l)};save();toast(qty+'× '+it.nombre+' agregado')}
function pinOk(m){
  const emp=S.empleados.find(e=>e.pin===m.v);
  if(!emp){m.err='PIN incorrecto. Intenta otra vez.';m.v='';return}
  const p=m.para;
  if(p.k==='rol'){if(!PERM[emp.puesto].includes(p.rol)){m.err=emp.nombre+' ('+emp.puesto+') no tiene acceso a '+ROLES[p.rol].t;m.v='';return}ui.rol=p.rol;ui.user=emp;ui.modal=null;ultimasComandas=-1;render();scrollTo(0,0);return}
  if(p.k==='mih'){ui.modal={tipo:'mih',emp:emp.id};return}
  if(p.k==='asist'){const r=S.asist.filter(a=>a.emp===emp.id&&hoy(a.t));const tipo=r.length&&r[r.length-1].tipo==='entrada'?'salida':'entrada';S.asist.push({emp:emp.id,tipo,t:Date.now()});save();ui.modal=null;
    let extra='';if(tipo==='entrada'){const s=estadoDia(emp.id,new Date());extra=s.st==='retardo'?' · quedó como retardo':s.st==='descanso'?' · hoy era su descanso':''}
    toast((tipo==='entrada'?'Entrada':'Salida')+' de '+emp.nombre+' a las '+hora(Date.now())+extra);render();return}
  if(p.k==='cancel'){if(!PERM[emp.puesto].includes('autoriza')){m.err='Solo el gerente o la encargada pueden cancelar';m.v='';return}
    const mot=(m.motivoTxt||'').trim();if(!mot){m.err='Escribe el motivo arriba';m.v='';return}
    const o=S.ordenes.find(x=>x.id===p.o),i=o.items.find(x=>x.id===p.i);i.cancel=true;S.movs.push({id:uid(),t:Date.now(),tipo:'Cancelación',quien:emp.nombre,det:i.qty+'× '+i.nombre+' · '+oNombre(o),motivo:mot,monto:i.precio*i.qty});save();ui.modal=null;toast('Cancelado y registrado');render()}
}
function cargarImg(file,max,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.75))};img.src=r.result};r.readAsDataURL(file)}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f)f(b.dataset,b,e)});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.f){const [col,id,field]=t.dataset.f.split(':');const obj=col==='config'?S.config:S[col].find(x=>x.id===id);if(!obj)return;
    let v=t.type==='checkbox'?t.checked:t.type==='number'?(+t.value||0):t.value;
    if(col==='empleados'&&field==='pin'){if(!/^\d{4}$/.test(v)){toast('El PIN debe tener 4 números');render();return}if(S.empleados.some(x=>x.pin===v&&x.id!==id)){toast('Ese PIN ya lo usa otra persona');render();return}}
    obj[field]=v;save();toast('Guardado');render();return}
  if(t.dataset.h){const [e,dow,f]=t.dataset.h.split(':');const x=S.horarios[e][+dow];if(x&&t.value){x[f]=t.value;save();toast('Horario guardado')}return}
  if(t.dataset.tol){S.tolerancia=Math.max(0,+t.value||0);save();render();return}
  if(t.dataset.np){ui.np[t.dataset.np]=t.type==='number'?+t.value:t.value;return}
  if(t.dataset.oc){const o=S.ordenes.find(x=>x.id===t.dataset.oc);o.cliente=t.value;save();return}
  if(t.dataset.foto&&t.files[0]){cargarImg(t.files[0],480,u=>{S.menu.find(x=>x.id===t.dataset.foto).foto=u;save();toast('Foto guardada');render()})}
  if(t.dataset.logo&&t.files[0]){cargarImg(t.files[0],240,u=>{S.config.logo=u;save();toast('Logo actualizado');render()})}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.np)ui.np[t.dataset.np]=t.type==='number'?+t.value:t.value;
  if(t.id==='buscar'){ui.q=t.value;const o=S.ordenes.find(x=>x.id===ui.orden);document.getElementById('items').innerHTML=itemsHtml(o);const tb=document.querySelector('.tabs');if(tb)tb.hidden=!!ui.q}
  if(t.id==='mbuscar'){ui.mq=t.value;const pos=t.selectionStart;render();const n=document.getElementById('mbuscar');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}
  if(t.id==='aq'){ui.modal.q=t.value;const q=norm(t.value);document.getElementById('faq').innerHTML=faqHtml(faqBuscar(t.value))}
  if(t.id==='cambioP'){keepItem();const pos=t.selectionStart;renderModal();const n=document.getElementById('cambioP');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}
  if(t.id==='recib'||t.id==='mixef'){keepPay();const pos=t.selectionStart;renderModal();const n=document.getElementById(t.id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal)A.cerrar();if(ui.modal&&ui.modal.tipo==='pin'&&/^[0-9]$/.test(e.key)&&document.activeElement.id!=='motivo')A.pinK({k:e.key});if(ui.modal&&ui.modal.tipo==='pin'&&e.key==='Backspace'&&document.activeElement.id!=='motivo')A.pinK({k:'⌫'})});
setInterval(()=>{if(ui.rol==='cocina'&&!ui.modal)render()},15000);
load();render();nubeIniciar();
</script>
